<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eee}
#canvas-wrap{width:100%;height:100%;position:relative}
#canvas{width:100%;height:100%;display:block}
#info{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.82);padding:8px 12px;border-radius:6px;font-size:12px;max-width:380px;z-index:10;display:none;border:1px solid rgba(255,255,255,0.08)}
#info.show{display:block}
#info .row{display:flex;gap:10px;flex-wrap:wrap}
#info .row span{color:#888}
#info .row b{color:#fff}
#legend{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.82);padding:10px 14px;border-radius:6px;font-size:11px;z-index:10;max-height:90vh;overflow-y:auto;min-width:200px;border:1px solid rgba(255,255,255,0.08)}
#legend h3{font-size:12px;color:#aaa;margin-bottom:8px}
#legend .entry{display:flex;align-items:center;gap:8px;margin-bottom:3px;cursor:pointer;padding:2px 4px;border-radius:3px}
#legend .entry:hover{background:rgba(255,255,255,0.06)}
#legend .swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0}
#legend .lbl{font-size:11px;color:#ccc}
#legend .lbl small{color:#666;font-size:9px}
#legend .pending{color:#ffaa00;font-size:9px;margin-left:4px}
#hint{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:4px;font-size:10px;color:#666;z-index:10}
#badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:6px;font-size:11px;color:#888;z-index:10;border:1px solid rgba(255,255,255,0.06)}
#badge b{color:#00FF7F}
</style>
</head>

function loadEditorZones() {
  try {
    const raw = localStorage.getItem(EDITOR_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d.zones && d.zones.length ? d.zones : null;
  } catch(e) { return null; }
}

function loadEditorRoads() {
  try {
    const raw = localStorage.getItem(EDITOR_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d.roads && d.roads.length ? d.roads : null;
  } catch(e) { return null; }
}

// Convert normalized editor coords (0-1 WRT 5042x4474) to 3D pixel coords
// Assumes both images cover the same physical area proportionally
function normToPx(nx, ny) {
  // map: (norm * EDITOR_IMG) space → (norm * meta.image_w_px) space
  return { x: nx * meta.image_w_px, y: ny * meta.image_h_px };
}

// 3D shape property lookup from BLOCKOUT objects

  const props = {
    shape: o.shape || 'box',
    height_m_estimated: o.height_m_estimated || 4,
    rotation_deg: o.rotation_deg || 0,
    render_mode: o.render_mode || 'building',
    subtype: o.subtype || '',
    validation_status: o.validation_status || '',
    color: o.color || '#cccccc',
  };
  shapeProps[o.id] = props;
});

// Map editor zone IDs → BLOCKOUT IDs where names differ
const zoneIdAlias = {
  'Clasificadora': 'Z03_E03_clasif',
  'Taller': 'Z03_E11_taller',
  'Z04': 'Z04_E01',
  'Z14': 'Z14_E01',
  'Z17': 'Z17_D01',
  'Z20': 'Z20_E01',
  'Z21': 'Z21_E01',
  'Z22': 'Z22_E01',
};

function lookupShapeProps(zoneId) {
  return shapeProps[zoneId] || (zoneIdAlias[zoneId] ? shapeProps[zoneIdAlias[zoneId]] : null);
}

function mergeZones() {
  const ez = loadEditorZones();
  if (!ez) return null;
  const used = new Set();
  const merged = [];
  ez.forEach(z => {
    used.add(z.id);
    const p = lookupShapeProps(z.id) || {};
    const c = normToPx(z.x + z.w/2, z.y + z.h/2);
    const w_px = z.w * meta.image_w_px;
    const d_px = z.h * meta.image_h_px;
    const hm = p.height_m_estimated || 4;
    merged.push({
      id: z.id,
      shape: p.shape || 'box',
      footprint: { cx: c.x, cz: c.y, w: w_px, d: d_px },
      height_m_estimated: hm,
      height_3d_units: hm / METERS_PER_UNIT,
      rotation_deg: p.rotation_deg || 0,
      color: z.color || p.color || '#cccccc',
      render_mode: p.render_mode || 'building',
      subtype: p.subtype || '',
      validation_status: p.validation_status || '',
      label: z.name || z.id,
    });
  });
  objects.forEach(o => {
    if (!used.has(o.id)) {
      merged.push({ ...o, height_3d_units: o.height_3d_units || ((o.height_m_estimated || 4) / METERS_PER_UNIT) });
    }
  });
  return merged;
}

function mergeRoads() {
  const er = loadEditorRoads();
  if (!er || !er.length) return null;
  return er.map(r => ({
    id: r.id,
    name: r.name || '',
    road_type: r.type || 'interna',
    width_px: r.width_px || 6,
    color: r.color || '#666',
    description: r.description || '',
    points_pixels: r.points.map(p => ({ x: p.x * meta.image_w_px, y: p.y * meta.image_h_px }))
  }));
}

function roadSegment(x1,z1,x2,z2,w,mat,elev) {
  const dx=x2-x1, dz=z2-z1;
  const len=Math.sqrt(dx*dx+dz*dz);
  if (len<0.001) return null;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,len), mat);
  m.rotation.x=-Math.PI/2;
  m.rotation.y=Math.atan2(dx,dz);
  m.position.set((x1+x2)/2,elev,(z1+z2)/2);
  return m;
}

function buildRoadMesh(road) {
  const pts=road.points_pixels;
  if (!pts||pts.length<2) return;
  const type=road.road_type||'interna';
  const cfg=ROAD_CFG[type]||ROAD_CFG.interna;
  const isAlamb=type==='alambrado';
  const elev=0.003;
  const group=new THREE.Group();

  if (isAlamb) {
    const w=(road.width_px||6)*ROAD_SCALE*0.4;
    const mat=new THREE.MeshStandardMaterial({
      color:0x8888aa,roughness:0.5,metalness:0.0,
      transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false
    });
    for (let i=0;i<pts.length-1;i++) {
      const s=roadSegment(pts[i].x*ROAD_SCALE,pts[i].y*ROAD_SCALE,
                          pts[i+1].x*ROAD_SCALE,pts[i+1].y*ROAD_SCALE,w,mat,elev);
      if (s) group.add(s);
    }
    return group;
  }

  const roadW=cfg.w_m/M2U;
  const mat=new THREE.MeshStandardMaterial({
    color:cfg.color,roughness:0.92,metalness:0.0,side:THREE.DoubleSide
  });
  const edgeMat=new THREE.MeshStandardMaterial({
    color:0xcccccc,roughness:0.6,metalness:0.0,side:THREE.DoubleSide
  });

  for (let i=0;i<pts.length-1;i++) {
    const ax=pts[i].x*ROAD_SCALE,az=pts[i].y*ROAD_SCALE;
    const bx=pts[i+1].x*ROAD_SCALE,bz=pts[i+1].y*ROAD_SCALE;
    const dx=bx-ax,dz=bz-az;
    const len=Math.sqrt(dx*dx+dz*dz);
    if (len<0.001) continue;
    const ang=Math.atan2(dx,dz);
    const mx=(ax+bx)/2, mz=(az+bz)/2;
    const perpX=-Math.cos(ang), perpZ=Math.sin(ang);
    const edgeW=0.018;

    const surf=new THREE.Mesh(new THREE.PlaneGeometry(roadW,len),mat);
    surf.rotation.x=-Math.PI/2; surf.rotation.y=ang;
    surf.position.set(mx,elev,mz);
    group.add(surf);

    const hw=roadW/2-edgeW/2;
    [ -1, 1 ].forEach(s=>{
      const e=new THREE.Mesh(new THREE.PlaneGeometry(edgeW,len),edgeMat);
      e.rotation.x=-Math.PI/2; e.rotation.y=ang;
      e.position.set(mx+s*hw*perpX,elev+0.0005,mz+s*hw*perpZ);
      group.add(e);
    });
  }
  return group;
}

function hexColor(c) {
  if (!c) return 0xcccccc;
  if (typeof c === 'number') return c;
  return parseInt(c.replace('#', ''), 16);
}

function buildShape(obj) {
  const fp = obj.footprint;
  const h = Math.max(obj.height_3d_units || 0.001, 0.001) * EXAG;
  const color = hexColor(obj.color);
  const opacity = (obj.render_mode === 'footprint' || obj.render_mode === 'pending_footprint') ? 0.1 : 0.35;
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.6, metalness: 0.05,
    transparent: opacity < 1, opacity, side: THREE.DoubleSide
  });

  let mesh;
  const shape = obj.shape || 'box';
  switch(shape) {
    case 'cylinder_tall': case 'cylinder_low': {
      const r = Math.min(fp.w, fp.d) / 2;
      const g = new THREE.CylinderGeometry(r, r, h, shape === 'cylinder_low' ? 24 : 20);
      mesh = new THREE.Mesh(g, mat);
      mesh.position.set(fp.cx, h / 2, fp.cz);
      break;
    }
    case 'cylinder_long': {
      const r = Math.min(fp.w, fp.d) / 2;
      const len = Math.max(fp.w, fp.d);
      const g = new THREE.CylinderGeometry(r, r, len, 18);
      mesh = new THREE.Mesh(g, mat);
      if (fp.w >= fp.d) mesh.rotation.z = Math.PI / 2;
      else mesh.rotation.x = Math.PI / 2;
      mesh.position.set(fp.cx, Math.max(r, h / 2), fp.cz);
      break;
    }
    case 'gable_box': {
      const group = new THREE.Group();
      const wallH = h * 0.65, roofH = h * 0.35;
      const walls = new THREE.Mesh(new THREE.BoxGeometry(fp.w, wallH, fp.d), mat);
      walls.position.y = wallH / 2;
      group.add(walls);
      const roofGeo = new THREE.CylinderGeometry(roofH, roofH, fp.w, 3, 1);
      const roof = new THREE.Mesh(roofGeo, mat.clone());
      roof.material.color.setHex(0xcc4444);
      roof.rotation.z = Math.PI / 2;
      roof.position.y = wallH + roofH / 2;
      roof.scale.set(1, fp.d / (fp.w || 1), 1);
      group.add(roof);
      group.position.set(fp.cx, 0, fp.cz);
      mesh = group;
      break;
    }
    case 'tower': {
      const cw = Math.min(fp.w, fp.d);
      mesh = new THREE.Mesh(new THREE.BoxGeometry(cw, h, cw), mat);
      mesh.position.set(fp.cx, h / 2, fp.cz);
      break;
    }
    case 'flat_slab': case 'flat_organic': {
      const slab = Math.max(h, 0.02);
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, slab, fp.d), mat);
      mesh.position.set(fp.cx, slab / 2, fp.cz);
      break;
    }
    case 'flat_transparent': {
      const flatMat = new THREE.MeshStandardMaterial({
        color, roughness: 1, transparent: true, opacity: 0.08, side: THREE.DoubleSide
      });
      mesh = new THREE.Mesh(new THREE.PlaneGeometry(fp.w, fp.d), flatMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(fp.cx, 0.005, fp.cz);
      break;
    }
    case 'elevated_beam': {
      const beamH = Math.max(h, 0.05);
      const elev = (5.0 / METERS_PER_UNIT) * EXAG;
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, beamH, fp.d), mat);
      mesh.position.set(fp.cx, elev + beamH / 2, fp.cz);
      break;
    }
    default: {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, h, fp.d), mat);
      mesh.position.set(fp.cx, h / 2, fp.cz);
    }
  }
  if (mesh && obj.rotation_deg) {
    mesh.rotation.y = obj.rotation_deg * Math.PI / 180;
  }
  return mesh;
}

function findObjFromHit(intersects) {
  for (const hit of intersects) {
    let o = hit.object;
    while (o) {
      if (o.userData && o.userData.obj) return o.userData.obj;
      o = o.parent;
    }
  }
  return null;
}

function findTopMesh(objId) {
  for (const c of buildingGroup.children) {
    if (c.userData && c.userData.obj && c.userData.obj.id === objId) return c;
    if (c.isGroup && c.children.length) {
      for (const ch of c.children) {
        if (ch.userData && ch.userData.obj && ch.userData.obj.id === objId) return c;
      }
    }
  }
  return null;
}

function showHighlight(mesh) {
  if (highlightMesh) { scene.remove(highlightMesh); highlightMesh = null; }
  if (!mesh) return;
  const fp = mesh.userData.obj.footprint;
  const h = Math.max((mesh.userData.obj.height_3d_units || 0.001) * EXAG, 0.001);
  const geo = new THREE.BoxGeometry(fp.w + 0.08, h + 0.08, fp.d + 0.08);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.4 });
  highlightMesh = new THREE.Mesh(geo, mat);
  highlightMesh.position.copy(mesh.position);
  if (mesh.rotation) highlightMesh.rotation.copy(mesh.rotation);
  scene.add(highlightMesh);
}

function getDragPoint(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  const mx = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  const my = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  pointer.set(mx, my);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.ray.intersectPlane(dragPlane, intersection);
  return hit ? intersection.clone() : null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  dragStartMouse.set(e.clientX, e.clientY);
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(getMeshes());
  const obj = findObjFromHit(intersects);
  if (obj && obj.render_mode === 'building') {
    selectedObj = obj;
    selectedMesh = findTopMesh(obj.id);
    isDragging = false;
    dragMoved = false;
    controls.enabled = false;
    renderer.domElement.style.cursor = 'grabbing';
  } else {
    selectedObj = null;
    selectedMesh = null;
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (selectedObj && selectedMesh) {
    const dx = e.clientX - dragStartMouse.x;
    const dy = e.clientY - dragStartMouse.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      isDragging = true;
      dragMoved = true;
    }
    if (isDragging) {
      const pt = getDragPoint(e);
      if (pt) {
        const h = Math.max((selectedObj.height_3d_units || 0.001) * EXAG, 0.001);
        selectedMesh.position.x = pt.x;
        selectedMesh.position.z = pt.z;
        if (highlightMesh) {
          highlightMesh.position.x = pt.x;
          highlightMesh.position.z = pt.z;
        }
        const labelObj = labelMap.get(selectedObj.id);
        if (labelObj) {
          labelObj.position.x = pt.x;
          labelObj.position.z = pt.z;
        }
      }
      return;
    }
  }

  // Hover
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(getMeshes());
  let newHovered = null;
  if (!isDragging) {
    const obj = findObjFromHit(hits);
    if (obj) newHovered = obj.id;
  }
  if (newHovered !== hoveredId) {
    hoveredId = newHovered;
    renderer.domElement.style.cursor = hoveredId ? 'pointer' : 'default';
    showHighlight(hoveredId ? findTopMesh(hoveredId) : null);
  }
});

renderer.domElement.addEventListener('pointerup', e => {
  if (dragMoved && isDragging && selectedObj) {
    selectedObj.footprint.cx = selectedMesh.position.x;
    selectedObj.footprint.cz = selectedMesh.position.z;
    showInfo(selectedObj);
  }
  if (!dragMoved && selectedObj) {
    showInfo(selectedObj);
  }
  if (!dragMoved && !selectedObj) {
    infoEl.classList.remove('show');
  }
  isDragging = false;
  selectedObj = null;
  selectedMesh = null;
  controls.enabled = true;
  renderer.domElement.style.cursor = 'default';
});

function showInfo(obj) {
  const fp = obj.footprint;
  const w_m = (fp.w * METERS_PER_UNIT).toFixed(1);
  const d_m = (fp.d * METERS_PER_UNIT).toFixed(1);
  const h_m = obj.height_m_estimated || 0;
  const rot = obj.rotation_deg ? obj.rotation_deg + '\u00b0' : '0\u00b0';
  const subtype = obj.subtype || '';
  const status = obj.validation_status || '';
  const label = obj.label || obj.id;

  infoEl.innerHTML =
    '<div class="row"><b style="color:' + (obj.color || '#fff') + '">' + label + '</b> <span>(' + obj.id + ')</span></div>' +
    '<div class="row"><span>Tipo</span><b>' + subtype + '</b> | <span>Shape</span><b>' + (obj.shape || 'box') + '</b></div>' +
    '<div class="row"><span>Dimensiones</span><b>' + w_m + 'm</b> &times; <b>' + d_m + 'm</b> &times; <b>' + h_m + 'm</b> <span>rot ' + rot + '</span></div>' +
    '<div class="row"><span>Pos.</span><b>(' + fp.cx.toFixed(2) + ', ' + fp.cz.toFixed(2) + ')</b> <span>w=' + fp.w.toFixed(3) + ' d=' + fp.d.toFixed(3) + '</span></div>' +
    '<div class="row"><span>Estado</span><b style="color:' + (status.includes('validated') ? '#4caf50' : status.includes('pending') ? '#ffaa00' : '#888') + '">' + status + '</b></div>';
  infoEl.classList.add('show');
}

// ===== LEGEND =====
const legendList = document.getElementById('legend-list');
const seen = {};
sceneZones.forEach(obj => {
  const key = obj.color + '|' + (obj.subtype || obj.shape);
  if (seen[key]) return;
  seen[key] = true;
  const entry = document.createElement('div');
  entry.className = 'entry';
  const swatch = document.createElement('div');
  swatch.className = 'swatch';
  swatch.style.background = obj.color || '#666';
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  const sub = obj.subtype ? obj.subtype.replace(/_/g, ' ') : (obj.shape || '');
  lbl.innerHTML = sub + ' <small>' + (obj.shape || '') + '</small>';
  entry.appendChild(swatch);
  entry.appendChild(lbl);
  entry.addEventListener('click', () => {
    const mesh = meshMap.get(obj.id);
    if (mesh) {
      controls.target.set(obj.footprint.cx, 0, obj.footprint.cz);
      camera.position.set(obj.footprint.cx + 8, 6, obj.footprint.cz + 8);
      controls.update();
      showInfo(obj);
    }
  });
  legendList.appendChild(entry);
});

// pending info
const pm = BLOCKOUT.pending_microzones || [];
if (pm.length) {
  const sep = document.createElement('div');
  sep.style.cssText = 'border-top:1px solid #333;margin:8px 0 6px;padding-top:6px;color:#666;font-size:10px';
  sep.textContent = 'Pendientes:';
  legendList.appendChild(sep);
  pm.forEach(p => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = '<span class="pending">\u26a0</span><span class="lbl">' + p.name + ' <small>' + p.reason + '</small></span>';
    legendList.appendChild(div);
  });
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// ===== ANIMATION LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (highlightMesh && selectedObj) {
    highlightMesh.position.copy(selectedMesh.position);
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

console.log('Zalei Atlas 3D cargado. ' + sceneZones.length + ' objetos renderizados.');
</script>
</body>
