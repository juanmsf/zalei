<!DOCTYPE html>
<html lang="es">
<head>
<script src="../auth.js"></script>
<meta charset="UTF-8">
<title>Zalei Atlas — 3D Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eee}

#app{display:flex;height:100vh}

/* Canvas */
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
#mode-bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,0.8);padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(4px);z-index:10}
.mode-btn{padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#888;transition:all 0.15s}
.mode-btn:hover{color:#ddd;background:rgba(255,255,255,0.06)}
.mode-btn.active{background:#0066cc;color:#fff}
.mode-btn.crop-active{background:#cc6600;color:#fff}

#info-overlay{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.78);padding:8px 12px;border-radius:6px;font-size:11px;max-width:400px;z-index:10}
#info-overlay .row{display:flex;gap:12px;flex-wrap:wrap}
#info-overlay .row span{color:#888}
#info-overlay .row b{color:#fff}
#status-msg{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,0.8);padding:8px 14px;border-radius:6px;font-size:11px;color:#ffaa00;z-index:10;display:none}

.crop-preview{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.85);padding:10px;border-radius:8px;z-index:10;display:none;max-width:260px}
.crop-preview.show{display:block}
.crop-preview h3{font-size:11px;color:#aaa;margin-bottom:6px}
.crop-preview canvas{width:100%;border:1px solid #333;border-radius:4px}

/* Panel */
#panel{width:340px;background:#141414;border-left:1px solid #222;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#panel-header{padding:14px;border-bottom:1px solid #222}
#panel-header h2{font-size:14px;font-weight:700}
#panel-header .sub{font-size:10px;color:#666;margin-top:2px}

#panel-tabs{display:flex;border-bottom:1px solid #222}
.panel-tab{flex:1;padding:10px;text-align:center;cursor:pointer;background:transparent;border:none;color:#666;font-size:11px;font-weight:600;border-bottom:2px solid transparent}
.panel-tab.active{color:#fff;border-bottom-color:#0066cc;background:#1a1a1a}

#panel-body{flex:1;overflow-y:auto;padding:0}
#props-panel,#crop-panel{display:none;padding:14px}
#props-panel.show,#crop-panel.show{display:block}

.prop-group{margin-bottom:14px}
.prop-group h4{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.prop-row{display:flex;gap:6px;margin-bottom:4px;align-items:center}
.prop-row label{font-size:11px;color:#888;min-width:50px}
.prop-row input{flex:1;background:#1a1a1a;color:#eee;border:1px solid #333;padding:5px 7px;border-radius:3px;font-size:12px;font-family:monospace}
.prop-row input:focus{outline:none;border-color:#0066cc}
.prop-row .readonly{background:#111;color:#666}
.prop-row input[type="color"]{width:36px;height:28px;padding:2px;cursor:pointer;flex:0 0 auto}

.btn{background:#222;color:#ddd;border:1px solid #444;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:11px;transition:all 0.15s}
.btn:hover{background:#333;color:#fff}
.btn.primary{background:#0066cc;border-color:#0088ee}
.btn.primary:hover{background:#0077dd}
.btn.success{background:#2a7;border-color:#4c9}
.btn.success:hover{background:#3a8}
.btn.danger{background:#a22;border-color:#c44}
.btn.danger:hover{background:#c33}
.btn.small{padding:3px 8px;font-size:10px}

.action-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.action-row .btn{flex:1;text-align:center;font-weight:600}

#crop-panel label{font-size:11px;color:#888;display:block;margin-bottom:4px}
#crop-panel .bbox-display{background:#000;font-family:monospace;font-size:11px;color:#6f6;padding:6px;border-radius:3px;margin-bottom:8px;word-break:break-all}

#export-area{width:100%;min-height:100px;background:#000;color:#6f6;font-family:monospace;font-size:10px;border:1px solid #333;padding:6px;resize:vertical;margin-top:10px}

#obj-list{max-height:200px;overflow-y:auto;margin-bottom:8px}
.obj-item{padding:5px 8px;cursor:pointer;font-size:11px;border-left:3px solid transparent;display:flex;align-items:center;gap:6px}
.obj-item:hover{background:#1c1c1c}
.obj-item.active{background:#1a2a3a;border-left-color:#0066cc}
.obj-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.obj-name{flex:1;color:#aaa}
.obj-id{color:#555;font-family:monospace;font-size:10px}
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>

    <div id="mode-bar">
      <button class="mode-btn active" data-mode="select" title="Seleccionar y mover elementos">Select</button>
      <button class="mode-btn" data-mode="resize" title="Redimensionar bordes">Resize</button>
      <button class="mode-btn" data-mode="crop" title="Definir área de crop">Crop</button>
    </div>

    <div id="info-overlay">
      <div class="row">
        <span><b id="sel-id">—</b></span>
        <span><b id="sel-coords">—</b></span>
        <span><b id="sel-size">—</b></span>
        <span id="mode-label" style="color:#0066cc">SELECT</span>
      </div>
    </div>

    <div id="status-msg"></div>

    <div class="crop-preview" id="crop-preview">
      <h3>Crop Preview</h3>
      <canvas id="crop-preview-canvas" width="200" height="150"></canvas>
    </div>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h2>Atlas 3D Editor</h2>
      <div class="sub">Satellite-textured · 22 zones · Drag/Resize/Crop</div>
    </div>

    <div id="panel-tabs">
      <button class="panel-tab active" data-ptab="props">Properties</button>
      <button class="panel-tab" data-ptab="crop">Crop</button>
      <button class="panel-tab" data-ptab="export">Export</button>
    </div>

    <div id="panel-body">
      <!-- Properties Panel -->
      <div id="props-panel" class="show">
        <div id="props-content">
          <div style="color:#555;font-size:12px;text-align:center;padding:40px 0">Seleccioná un elemento en el visor 3D</div>
        </div>
      </div>

      <!-- Crop Panel -->
      <div id="crop-panel">
        <div id="crop-content">
          <p style="color:#555;font-size:12px;margin-bottom:10px">Seleccioná modo <b>Crop</b> arriba y hacé clic en 2 esquinas del área a recortar.</p>
          <div id="crop-bbox" class="bbox-display">—</div>
          <div class="action-row">
            <button class="btn success" id="btn-crop-save" onclick="saveCrop()">Save Crop</button>
            <button class="btn" id="btn-crop-clear" onclick="clearCrop()">Clear</button>
          </div>
        </div>
      </div>

      <!-- Export Panel -->
      <div id="export-panel" style="display:none;padding:14px">
        <div class="action-row">
          <button class="btn primary" onclick="exportJSON()">📋 Copy JSON</button>
          <button class="btn success" onclick="downloadJSON()">💾 Download</button>
        </div>
        <textarea id="export-area" readonly></textarea>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

let objects = JSON.parse(JSON.stringify(OBJECTS));
let selectedId = null;
let editingMode = 'select'; // select | resize | crop
let cropPoints = [];

// Three.js groups
const groupBuildings = new THREE.Group(); scene.add(groupBuildings);
const groupFootprints = new THREE.Group(); scene.add(groupFootprints);
const groupHandles = new THREE.Group(); scene.add(groupHandles);
const groupCrop = new THREE.Group(); scene.add(groupCrop);
const groupSelection = new THREE.Group(); scene.add(groupSelection);

let meshMap = new Map(); // id -> three mesh
let handleMeshes = [];

const SHAPE_CATALOG = {
  cylinder_tally: {default_h_m:18}, cylinder_low: {default_h_m:4},
  cylinder_long: {default_h_m:2.5}, gable_box: {default_h_m:5},
  box: {default_h_m:4}, tower: {default_h_m:14},
  flat_slab: {default_h_m:0.4}, flat_organic: {default_h_m:0.5},
  flat_transparent: {default_h_m:0}, elevated_beam: {default_h_m:1.5}
};

function hex(h){return new THREE.Color(h)}

function buildShape(obj) {
  const fp = obj.footprint;
  const h = Math.max(obj.height_3d_units, 0.001) * exag;
  const color = hex(obj.color);
  const isBuilding = obj.render_mode === 'building' && obj.source === 'zone';
  const opacity = (obj.render_mode === 'footprint' || obj.render_mode === 'pending_footprint') ? 0.2 : 0.9;
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: isBuilding ? 0.6 : 0.8,
    metalness: (obj.subtype||'').includes('silo') || (obj.subtype||'').includes('tanque') ? 0.3 : 0.05,
    transparent: opacity < 1, opacity, side: THREE.DoubleSide,
    envMapIntensity: 0.4
  });

  let mesh;
  const shape = obj.shape || 'box';
  switch(shape) {
    case 'cylinder_tall': case 'cylinder_low': {
      const r = Math.min(fp.w, fp.d)/2;
      const g = new THREE.CylinderGeometry(r, r, h, shape === 'cylinder_low' ? 24 : 20);
      mesh = new THREE.Mesh(g, mat);
      mesh.position.set(fp.cx, h/2, fp.cz); break;
    }
    case 'cylinder_long': {
      const r = Math.min(fp.w, fp.d)/2; const len = Math.max(fp.w, fp.d);
      const g = new THREE.CylinderGeometry(r, r, len, 18);
      mesh = new THREE.Mesh(g, mat);
      if (fp.w >= fp.d) mesh.rotation.z = Math.PI/2; else mesh.rotation.x = Math.PI/2;
      mesh.position.set(fp.cx, Math.max(r, h/2), fp.cz); break;
    }
    case 'gable_box': {
      const group = new THREE.Group();
      const wallH = h * 0.65, roofH = h * 0.35;
      const walls = new THREE.Mesh(new THREE.BoxGeometry(fp.w, wallH, fp.d), mat);
      walls.position.y = wallH/2; group.add(walls);
      const hw = fp.w / 2, hd = fp.d / 2;
      const roofGeo = new THREE.BufferGeometry();
      const verts = fp.w >= fp.d ? new Float32Array([
        -hw, wallH, -hd,  -hw, wallH,  hd,  -hw, wallH + roofH, 0,
         hw, wallH,  hd,   hw, wallH, -hd,   hw, wallH + roofH, 0,
        -hw, wallH, -hd,   hw, wallH, -hd,   hw, wallH + roofH, 0,
        -hw, wallH, -hd,   hw, wallH + roofH, 0,  -hw, wallH + roofH, 0,
         hw, wallH,  hd,  -hw, wallH,  hd,  -hw, wallH + roofH, 0,
         hw, wallH,  hd,  -hw, wallH + roofH, 0,   hw, wallH + roofH, 0
      ]) : new Float32Array([
        -hw, wallH, -hd,   hw, wallH, -hd,   0, wallH + roofH, -hd,
         hw, wallH,  hd,  -hw, wallH,  hd,   0, wallH + roofH,  hd,
        -hw, wallH,  hd,  -hw, wallH, -hd,   0, wallH + roofH, -hd,
        -hw, wallH,  hd,   0, wallH + roofH, -hd,  0, wallH + roofH,  hd,
         hw, wallH, -hd,   hw, wallH,  hd,   0, wallH + roofH,  hd,
         hw, wallH, -hd,   0, wallH + roofH,  hd,  0, wallH + roofH, -hd
      ]);
      roofGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      roofGeo.computeVertexNormals();
      const roof = new THREE.Mesh(roofGeo, mat);
      group.add(roof);
      group.position.set(fp.cx, 0, fp.cz);
      mesh = group; break;
    }
    case 'tower': {
      const cw = Math.min(fp.w, fp.d);
      mesh = new THREE.Mesh(new THREE.BoxGeometry(cw, h, cw), mat);
      mesh.position.set(fp.cx, h/2, fp.cz); break;
    }
    case 'flat_slab': case 'flat_organic': {
      const slab = Math.max(h, 0.02);
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, slab, fp.d), mat);
      mesh.position.set(fp.cx, slab/2, fp.cz); break;
    }
    case 'flat_transparent': {
      const flatMat = new THREE.MeshStandardMaterial({color, roughness:1, transparent:true, opacity:0.1, side:THREE.DoubleSide});
      mesh = new THREE.Mesh(new THREE.PlaneGeometry(fp.w, fp.d), flatMat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.set(fp.cx, 0.005, fp.cz); break;
    }
    case 'elevated_beam': {
      const beamH = Math.max(h, 0.05);
      const elev = mToUnits(5.0) * exag;
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, beamH, fp.d), mat);
      mesh.position.set(fp.cx, elev + beamH/2, fp.cz); break;
    }
    default: {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(fp.w, h, fp.d), mat);
      mesh.position.set(fp.cx, h/2, fp.cz);
    }
  }
  if (obj.rotation_deg) {
    mesh.rotation.y = -obj.rotation_deg * Math.PI / 180;
  }
  return mesh;
}

function mToUnits(m){ return m / 15.0; }

function setShadowRecursive(mesh, cast, receive) {
  mesh.castShadow = cast; mesh.receiveShadow = receive;
  if (mesh.children) mesh.children.forEach(c => setShadowRecursive(c, cast, receive));
}

function rebuildScene() {
  groupBuildings.children.slice().forEach(c => { groupBuildings.remove(c); if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); if (c.children) c.children.forEach(ch => { if (ch.geometry) ch.geometry.dispose(); if (ch.material) ch.material.dispose(); }); });
  groupFootprints.children.slice().forEach(c => { groupFootprints.remove(c); });
  meshMap.clear();

  objects.forEach(obj => {
    if (obj.render_mode === 'skipped') return;
    const mesh = buildShape(obj);
    mesh.userData = { id: obj.id, obj };
    const isSolid = obj.render_mode === 'building' && !['flat_transparent','flat_organic','flat_slab'].includes(obj.shape);
    setShadowRecursive(mesh, isSolid, isSolid);
    if (obj.render_mode === 'footprint' || obj.render_mode === 'pending_footprint') {
      groupFootprints.add(mesh);
    } else {
      groupBuildings.add(mesh);
    }
    meshMap.set(obj.id, mesh);
  });
  updateSelection();
  renderHandles();
}

function renderHandles() {
  groupHandles.children.slice().forEach(c => { groupHandles.remove(c); });
  handleMeshes = [];
  if (!selectedId || editingMode === 'crop') return;
  const obj = objects.find(o => o.id === selectedId);
  if (!obj || obj.render_mode === 'footprint' || obj.render_mode === 'pending_footprint') return;
  const fp = obj.footprint;
  const cx = fp.cx, cz = fp.cz;
  const hw = fp.w/2, hd = fp.d/2;

  const handleMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const handleMatHi = new THREE.MeshBasicMaterial({color:0xffcc00});

  const positions = [];
  if (editingMode === 'select') {
    // Single center handle for dragging
    positions.push({x:cx, z:cz, type:'move'});
  } else if (editingMode === 'resize') {
    // 4 corners + 4 midpoints
    const corners = [
      {x:cx-hw, z:cz-hd, type:'nw'}, {x:cx+hw, z:cz-hd, type:'ne'},
      {x:cx-hw, z:cz+hd, type:'sw'}, {x:cx+hw, z:cz+hd, type:'se'},
      {x:cx, z:cz-hd, type:'n'}, {x:cx, z:cz+hd, type:'s'},
      {x:cx-hw, z:cz, type:'w'}, {x:cx+hw, z:cz, type:'e'}
    ];
    corners.forEach(p => positions.push(p));
  }

  positions.forEach(p => {
    const geo = new THREE.SphereGeometry(p.type === 'move' ? 0.25 : 0.18, 12, 12);
    const mat = p.type === 'move' ? new THREE.MeshBasicMaterial({color:0x00ff88}) : new THREE.MeshBasicMaterial({color:0xffffff});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(p.x, 0.05, p.z);
    mesh.userData = { handleType: p.type, parentId: selectedId };
    handleMeshes.push(mesh);
    groupHandles.add(mesh);
  });
}

function updateSelection() {
  groupSelection.children.slice().forEach(c => { groupSelection.remove(c); });
  if (!selectedId) return;
  const mesh = meshMap.get(selectedId);
  if (!mesh) return;
  const obj = objects.find(o => o.id === selectedId);
  if (!obj) return;
  // Selection highlight: wireframe box around footprint
  const fp = obj.footprint;
  const boxGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(fp.w, 0.02, fp.d));
  const boxMat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.7});
  const box = new THREE.LineSegments(boxGeo, boxMat);
  box.position.set(fp.cx, 0.03, fp.cz);
  groupSelection.add(box);
  // Dashed border for larger selection
  const dashGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(fp.w + 0.15, 0.01, fp.d + 0.15));
  const dashMat = new THREE.LineBasicMaterial({color:0x00ff88, transparent:true, opacity:0.25});
  const dash = new THREE.LineSegments(dashGeo, dashMat);
  dash.position.set(fp.cx, 0.01, fp.cz);
  groupSelection.add(dash);
}

// ===================== RAYCASTER + INTERACTION =====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isDragging = false;
let dragTarget = null;
let dragStartMouse = new THREE.Vector2();
let dragStartData = null;

function getGroundPoint(event) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(pickerPlane);
  if (hits.length > 0) {
    return hits[0].point;
  }
  return null;
}

function hitTestObjects(event) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (editingMode !== 'crop') {
    // Check handles first
    const handleHits = raycaster.intersectObjects(handleMeshes);
    if (handleHits.length > 0) {
      const h = handleHits[0].object;
      return { type: 'handle', handleType: h.userData.handleType, parentId: h.userData.parentId };
    }
  }

  // Check building meshes
  const allMeshes = [];
  groupBuildings.children.forEach(c => collectMeshes(c, allMeshes));
  groupFootprints.children.forEach(c => collectMeshes(c, allMeshes));
  const hits = raycaster.intersectObjects(allMeshes, false);
  if (hits.length > 0) {
    let o = hits[0].object;
    while (o && !o.userData?.id) o = o.parent;
    if (o && o.userData?.id) {
      return { type: 'object', id: o.userData.id };
    }
  }
  return null;
}

function collectMeshes(obj, arr) {
  if (obj.isMesh) arr.push(obj);
  if (obj.children) obj.children.forEach(c => collectMeshes(c, arr));
}

// Mouse events
canvas.addEventListener('mousedown', event => {
  if (editingMode === 'crop') {
    const pt = getGroundPoint(event);
    if (pt) {
      const px = pt.x / TOTAL_W * IMG_W_PX;
      const py = pt.z / TOTAL_D * IMG_H_PX;
      cropPoints.push({ x3d: pt.x, z3d: pt.z, px: Math.round(px), py: Math.round(py) });
      if (cropPoints.length > 2) cropPoints = [cropPoints[cropPoints.length - 1]];
      renderCropRect();
      updateCropPanel();
    }
    return;
  }

  const hit = hitTestObjects(event);
  if (!hit) {
    if (editingMode !== 'resize') selectedId = null;
    updateSelection(); renderHandles(); updatePropsPanel(); updateInfo();
    return;
  }

  if (hit.type === 'handle') {
    isDragging = true;
    controls.enabled = false;
    dragTarget = { id: hit.parentId, handleType: hit.handleType };
    const pt = getGroundPoint(event);
    if (pt) dragStartMouse.set(pt.x, pt.z);

    const obj = objects.find(o => o.id === hit.parentId);
    if (obj) {
      dragStartData = {
        cx: obj.footprint.cx, cz: obj.footprint.cz,
        w: obj.footprint.w, d: obj.footprint.d
      };
    }
    return;
  }

  if (hit.type === 'object') {
    selectedId = hit.id;
    if (editingMode === 'select') {
      isDragging = true;
      controls.enabled = false;
      dragTarget = { id: hit.id, handleType: 'move' };
      const pt = getGroundPoint(event);
      if (pt) dragStartMouse.set(pt.x, pt.z);
      const obj = objects.find(o => o.id === hit.id);
      if (obj) {
        dragStartData = { cx: obj.footprint.cx, cz: obj.footprint.cz };
      }
    }
    updateSelection(); renderHandles(); updatePropsPanel(); updateInfo();
  }
});

canvas.addEventListener('mousemove', event => {
  if (!isDragging || !dragTarget) return;
  const pt = getGroundPoint(event);
  if (!pt) return;

  const obj = objects.find(o => o.id === dragTarget.id);
  if (!obj) return;

  const dx = pt.x - dragStartMouse.x;
  const dz = pt.z - dragStartMouse.y;

  if (dragTarget.handleType === 'move') {
    obj.footprint.cx = dragStartData.cx + dx;
    obj.footprint.cz = dragStartData.cz + dz;
    // Clamp
    obj.footprint.cx = Math.max(obj.footprint.w/2, Math.min(TOTAL_W - obj.footprint.w/2, obj.footprint.cx));
    obj.footprint.cz = Math.max(obj.footprint.d/2, Math.min(TOTAL_D - obj.footprint.d/2, obj.footprint.cz));
  } else if (['n','s','e','w','ne','nw','se','sw'].includes(dragTarget.handleType)) {
    const h = dragTarget.handleType;
    let {cx, cz, w, d} = dragStartData;
    if (h.includes('e')) { w = dragStartData.w + dx; }
    if (h.includes('w')) { w = dragStartData.w - dx; cx = dragStartData.cx + dx/2; }
    if (h.includes('s')) { d = dragStartData.d + dz; }
    if (h.includes('n')) { d = dragStartData.d - dz; cz = dragStartData.cz + dz/2; }
    w = Math.max(0.3, w); d = Math.max(0.3, d);
    obj.footprint.w = w; obj.footprint.d = d;
    obj.footprint.cx = cx; obj.footprint.cz = cz;
  }

  // Rebuild and restore selection
  rebuildScene();
  updateInfo();
  updatePropsPanel();
});

canvas.addEventListener('mouseup', () => {
  if (isDragging) {
    controls.enabled = true;
    isDragging = false;
    dragTarget = null;
    dragStartData = null;
  }
});

// ===================== CROP =====================
function renderCropRect() {
  groupCrop.children.slice().forEach(c => { groupCrop.remove(c); });
  if (cropPoints.length < 2) return;

  const p1 = cropPoints[0], p2 = cropPoints[1];
  const x1 = Math.min(p1.x3d, p2.x3d), z1 = Math.min(p1.z3d, p2.z3d);
  const x2 = Math.max(p1.x3d, p2.x3d), z2 = Math.max(p1.z3d, p2.z3d);
  const w = x2 - x1, d = z2 - z1;

  // Fill
  const fillMat = new THREE.MeshBasicMaterial({color:0xcc6600, transparent:true, opacity:0.12, side:THREE.DoubleSide, depthWrite:false});
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(w, d), fillMat);
  fill.rotation.x = -Math.PI/2;
  fill.position.set(x1 + w/2, 0.01, z1 + d/2);
  groupCrop.add(fill);

  // Border
  const borderMat = new THREE.LineBasicMaterial({color:0xff8800, linewidth:2});
  const borderGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d));
  const border = new THREE.LineSegments(borderGeo, borderMat);
  border.rotation.x = -Math.PI/2;
  border.position.set(x1 + w/2, 0.015, z1 + d/2);
  groupCrop.add(border);

  // Corner dots
  const dotMat = new THREE.MeshBasicMaterial({color:0xff8800});
  [[x1,z1],[x2,z1],[x1,z2],[x2,z2]].forEach(([px,pz]) => {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), dotMat);
    dot.position.set(px, 0.02, pz);
    groupCrop.add(dot);
  });
}

function updateCropPanel() {
  const el = document.getElementById('crop-bbox');
  if (cropPoints.length < 2) {
    el.textContent = `${cropPoints.length}/2 corners set`;
    return;
  }
  const p1 = cropPoints[0], p2 = cropPoints[1];
  const x1 = Math.min(p1.px, p2.px), y1 = Math.min(p1.py, p2.py);
  const x2 = Math.max(p1.px, p2.px), y2 = Math.max(p1.py, p2.py);
  const w = x2 - x1, h = y2 - y1;
  el.innerHTML = `Crop: (${x1},${y1}) → (${x2},${y2})<br>Size: ${w}×${h} px`;
}

function saveCrop() {
  if (cropPoints.length < 2) { alert('Definí 2 esquinas del crop primero'); return; }
  const p1 = cropPoints[0], p2 = cropPoints[1];
  const x1 = Math.min(p1.px, p2.px), y1 = Math.min(p1.py, p2.py);
  const x2 = Math.max(p1.px, p2.px), y2 = Math.max(p1.py, p2.py);
  const cropData = {
    x1, y1, x2, y2,
    w: x2 - x1, h: y2 - y1,
    units: { cx: (x1+x2)/2/100, cz: (y1+y2)/2/100, w: (x2-x1)/100, d: (y2-y1)/100 }
  };
  const blob = new Blob([JSON.stringify(cropData, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `crop_${x1}_${y1}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(blob);
  setMode('select');
  statusMsg('Crop saved!');
}

function clearCrop() {
  cropPoints = [];
  groupCrop.children.slice().forEach(c => { groupCrop.remove(c); });
  document.getElementById('crop-bbox').textContent = '—';
  document.getElementById('crop-preview').classList.remove('show');
}

      <h4>Footprint (coords normalizadas)</h4>
      <div class="prop-row"><label>CX</label><input type="number" step="0.01" value="${fp.cx.toFixed(3)}" onchange="updateFootprint('${obj.id}','cx',parseFloat(this.value))"></div>
      <div class="prop-row"><label>CZ</label><input type="number" step="0.01" value="${fp.cz.toFixed(3)}" onchange="updateFootprint('${obj.id}','cz',parseFloat(this.value))"></div>
      <div class="prop-row"><label>W</label><input type="number" step="0.01" value="${fp.w.toFixed(3)}" onchange="updateFootprint('${obj.id}','w',parseFloat(this.value))"></div>
      <div class="prop-row"><label>D</label><input type="number" step="0.01" value="${fp.d.toFixed(3)}" onchange="updateFootprint('${obj.id}','d',parseFloat(this.value))"></div>
      <div class="prop-row"><label>Rot (deg)</label><input type="number" step="1" value="${obj.rotation_deg||0}" onchange="updateRotation('${obj.id}',parseFloat(this.value))"></div>
    </div>
    <div class="prop-group">
      <h4>Pixels en imagen base</h4>
      <div class="prop-row"><label>X1</label><input class="readonly" value="${Math.round(fp.cx*100 - fp.w*100/2)}" readonly></div>
      <div class="prop-row"><label>Y1</label><input class="readonly" value="${Math.round(fp.cz*100 - fp.d*100/2)}" readonly></div>
      <div class="prop-row"><label>X2</label><input class="readonly" value="${Math.round(fp.cx*100 + fp.w*100/2)}" readonly></div>
      <div class="prop-row"><label>Y2</label><input class="readonly" value="${Math.round(fp.cz*100 + fp.d*100/2)}" readonly></div>
    </div>
    <div class="prop-group">
      <h4>Altura</h4>
      <div class="prop-row"><label>Height m</label><input class="readonly" value="${obj.height_m_estimated||'?'}" readonly></div>
      <div class="prop-row"><label>Confidence</label><input class="readonly" value="${obj.height_confidence||'?'}" readonly></div>
    </div>
    <div class="prop-group">
      <h4>Validación</h4>
      <div class="prop-row"><label>Status</label><input class="readonly" value="${obj.validation_status||'?'}" readonly></div>
      <div class="prop-row"><label>Source</label><input class="readonly" value="${obj.source||'zone'}" readonly></div>
    </div>
  `;
}

function updateField(id, field, value) {
  const obj = objects.find(o => o.id === id);
  if (!obj) return;
  if (field === 'color') obj.color = value;
  if (field === 'label') obj.label = value;
  rebuildScene();
  updateExport();
}

function updateFootprint(id, field, value) {
  const obj = objects.find(o => o.id === id);
  if (!obj) return;
  obj.footprint[field] = value;
  rebuildScene();
  updateExport();
}

function updateRotation(id, deg) {
  const obj = objects.find(o => o.id === id);
  if (!obj) return;
  if (deg === 0) delete obj.rotation_deg;
  else obj.rotation_deg = deg;
  rebuildScene();
  updateExport();
}

function updateInfo() {
  document.getElementById('sel-id').textContent = selectedId || '—';
  if (selectedId) {
    const obj = objects.find(o => o.id === selectedId);
    if (obj) {
      const fp = obj.footprint;
      document.getElementById('sel-coords').textContent = `CX:${fp.cx.toFixed(2)} CZ:${fp.cz.toFixed(2)}`;
      document.getElementById('sel-size').textContent = `${fp.w.toFixed(2)}×${fp.d.toFixed(2)} u`;
      return;
    }
  }
  document.getElementById('sel-coords').textContent = '—';
  document.getElementById('sel-size').textContent = '—';
}

function statusMsg(msg) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ===================== EXPORT =====================
function buildExportData() {
  return {
    project: 'Zalei Agropecuaria',
    method: 'Atlas 3D Editor',
    base_image: 'zalei_satellite_5042x4474.png',
    dimensions_3d: { w: TOTAL_W, d: TOTAL_D },
    dimensions_px: { w: IMG_W_PX, h: IMG_H_PX },
    timestamp: new Date().toISOString(),
    objects: objects.map(obj => ({
      id: obj.id, label: obj.label, color: obj.color, shape: obj.shape, subtype: obj.subtype,
      source: obj.source, render_mode: obj.render_mode, validation_status: obj.validation_status,
      height_m_estimated: obj.height_m_estimated, height_confidence: obj.height_confidence,
      rotation_deg: obj.rotation_deg || 0,
      footprint_units: { ...obj.footprint },
      footprint_pixels: {
        x1: Math.round((obj.footprint.cx - obj.footprint.w/2) * 100),
        y1: Math.round((obj.footprint.cz - obj.footprint.d/2) * 100),
        x2: Math.round((obj.footprint.cx + obj.footprint.w/2) * 100),
        y2: Math.round((obj.footprint.cz + obj.footprint.d/2) * 100),
        w: Math.round(obj.footprint.w * 100),
        h: Math.round(obj.footprint.d * 100)
      }
    }))
  };
}

function updateExport() {
  document.getElementById('export-area').value = JSON.stringify(buildExportData(), null, 2);
}

function exportJSON() {
  const ta = document.getElementById('export-area');
  ta.select();
  navigator.clipboard.writeText(ta.value).catch(() => document.execCommand('copy'));
  statusMsg('JSON copiado');
}

function downloadJSON() {
  const data = JSON.stringify(buildExportData(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `atlas_3d_editor_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(blob);
  statusMsg('JSON descargado');
}

// ===================== KEYBOARD =====================
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (cropPoints.length > 0 && editingMode === 'crop') { clearCrop(); }
    selectedId = null;
    updateSelection(); renderHandles(); updatePropsPanel(); updateInfo();
  }
  if (e.key === 'Delete' && selectedId) {
    if (confirm(`¿Eliminar ${selectedId}?`)) {
      objects = objects.filter(o => o.id !== selectedId);
      selectedId = null;
      rebuildScene();
      updatePropsPanel(); updateInfo(); updateExport();
    }
  }
  if (e.key === '1') setMode('select');
  if (e.key === '2') setMode('resize');
  if (e.key === '3') setMode('crop');
});

// ===================== RESIZE =====================
function resize() {
  const w = window.innerWidth - 340, h = window.innerHeight;
  renderer.setSize(Math.max(w, 340), h);
  camera.aspect = (Math.max(w, 340)) / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ===================== ANIMATE =====================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ===================== INIT =====================
rebuildScene();
updateInfo();
setMode('select');
animate();
</script>
</body>
</html>
