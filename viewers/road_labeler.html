<!DOCTYPE html>
<html lang="es">
<head>
<script src="../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Labeler — Zalei</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111;color:#eee;overflow:hidden}
body{display:flex;flex-direction:column}

#toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#1a1a1a;border-bottom:1px solid #333;flex-wrap:wrap}

.road-type-btn{padding:6px 14px;border:2px solid #555;border-radius:4px;background:#222;color:#ccc;cursor:pointer;font-size:13px;font-weight:600}
.road-type-btn.active{border-color:#fff;color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.2)}
.road-type-btn .swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}

#add-road{background:#2a6d2a;color:#fff;border:2px solid #4a9;padding:6px 18px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px}
#add-road:hover{background:#3a8d3a}
#finish-road{background:#6d2a2a;color:#fff;border:2px solid #a44;padding:6px 18px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px}
#finish-road:hover{background:#8d3a3a}
#undo-point{background:#444;color:#fff;border:1px solid #666;padding:4px 10px;border-radius:4px;cursor:pointer}
#export-json{background:#2a2a6d;color:#fff;border:2px solid #44a;padding:6px 18px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px;margin-left:auto}
#export-json:hover{background:#3a3a8d}
#clear-all{background:#6d2a2a;color:#fff;border:1px solid #a44;padding:4px 10px;border-radius:4px;cursor:pointer}
#undo-road{background:#555;color:#fff;border:1px solid #777;padding:4px 10px;border-radius:4px;cursor:pointer}
#zoom-in, #zoom-out, #zoom-reset{background:#333;color:#fff;border:1px solid #555;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:14px}
#zoom-reset{font-size:11px}

#img-wrap{position:relative;flex:1;overflow:hidden;background:#000;cursor:grab}
#img-wrap.dragging{cursor:grabbing}
#img-viewport{position:relative;display:inline-block;transform-origin:0 0;will-change:transform}
#base-img{display:block;max-width:none;user-select:none}
#canvas-overlay{position:absolute;top:0;left:0;pointer-events:none}
#click-catcher{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;z-index:2}
body.mode-edit #click-catcher{cursor:default}

#zoom-bar{position:absolute;bottom:16px;right:16px;display:flex;gap:4px;z-index:10;background:rgba(0,0,0,0.7);padding:6px 8px;border-radius:6px;align-items:center}
#zoom-bar span{color:#aaa;font-size:12px;min-width:40px;text-align:center}

#road-list{background:#1a1a1a;border-top:1px solid #333;padding:6px 12px;max-height:120px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.road-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid #444;background:#222;cursor:pointer}
.road-chip.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.3)}
.road-chip .del{cursor:pointer;color:#a55;font-weight:bold;margin-left:4px}
.road-chip .del:hover{color:#f55}
.road-chip .pts{color:#888}

#status{color:#888;font-size:12px;padding:4px 12px;background:#222;border-top:1px solid #333}
#export-area{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;padding:40px}
#export-area.show{display:flex;flex-direction:column}
#export-area textarea{flex:1;font-family:monospace;font-size:12px;background:#111;color:#0f0;border:1px solid #333;padding:12px;resize:none;white-space:pre}
#export-area .close-area{position:absolute;top:12px;right:12px;background:#a33;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:700}
#export-area .copy-btn{background:#33a;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:700;margin-top:8px;align-self:flex-end}

#mode-toggle{display:flex;gap:2px;background:#333;border-radius:4px;padding:2px}
#mode-toggle button{padding:4px 12px;border:none;background:transparent;color:#aaa;cursor:pointer;border-radius:3px;font-size:12px}
#mode-toggle button.active{background:#555;color:#fff}
</style>
</head>
<body>
<div id="toolbar">
  <span style="font-weight:700;color:#fff;margin-right:8px">Tipo:</span>
  <button class="road-type-btn active" data-type="perimetral" style="border-color:#FF6600"><span class="swatch" style="background:#FF6600"></span>Perimetral</button>

    <span style="color:#666">px</span>
  </label>
  <span style="width:1px;height:24px;background:#444;margin:0 8px"></span>
  <span style="color:#aaa;font-size:12px">Modo:</span>
  <div id="mode-toggle">
    <button data-mode="add" class="active">➕ Dibujar</button>
    <button data-mode="edit">✏️ Editar</button>
  </div>
  <span style="width:1px;height:24px;background:#444;margin:0 8px"></span>
  <button id="add-road">+ Nueva calle</button>

  <button id="undo-road">↩ Deshacer calle</button>
  <button id="clear-all">✖ Limpiar</button>
  <button id="export-json">📋 Exportar JSON</button>
</div>
<div id="img-wrap">
  <div id="img-viewport">
    <img id="base-img" src="../ZALEI%20Google%20Earth%20best%20resulution.jpg" alt="Satellite">
    <canvas id="canvas-overlay"></canvas>
    <div id="click-catcher"></div>
  </div>
  <div id="zoom-bar">
    <button id="zoom-out">−</button>
    <span id="zoom-pct">100%</span>
    <button id="zoom-in">+</button>
    <button id="zoom-reset">⟲</button>
  </div>
</div>
<div id="status">Cargando imagen...</div>
<div id="road-list"></div>
<div id="export-area">
  <button class="close-area">✖ Cerrar</button>
  <textarea id="json-output" readonly></textarea>
  <button class="copy-btn">📋 Copiar al portapapeles</button>
</div>

let roads = JSON.parse(JSON.stringify(INITIAL_ROADS));
let currentRoad = null;
let selectedRoadIdx = -1;
let nextId = 25;
let imgLoaded = false;
let mode = 'add';
let zoom = 1;
let panX = 0, panY = 0;
let isPanning = false, panStartX = 0, panStartY = 0;

// ── Drag state ──
let drag = null; // { kind:'node'|'road', roadIdx, ptIdx, startMouse, startPoints[] }

function getActiveType() {
  const active = document.querySelector('.road-type-btn.active');
  const w = parseInt(WIDTH_SLIDER.value);
  return { type: active.dataset.type, width: w, color: ROAD_COLORS[active.dataset.type] };
}

function syncToolbarToRoad(r) {
  TYPE_BTNS.forEach(b => b.classList.remove('active'));
  const match = Array.from(TYPE_BTNS).find(b => b.dataset.type === r.type);
  if (match) match.classList.add('active');
  else TYPE_BTNS[0].classList.add('active');
  WIDTH_SLIDER.value = r.width_px;
  WIDTH_DISPLAY.textContent = r.width_px;
}

// ── Image ──
IMG.onload = function() {
  imgLoaded = true;
  syncCanvasSize();
  centerView();
  drawAll();
  updateUI();
};
IMG.onerror = function() {
  STATUS.textContent = 'ERROR: No se pudo cargar la imagen. Verificá que ZALEI Google Earth best resulution.jpg existe.';
};

function centerView() {
  const cw = WRAP.clientWidth, ch = WRAP.clientHeight;
  const iw = IMG.naturalWidth, ih = IMG.naturalHeight;
  if (cw <= 0 || ch <= 0 || iw <= 0 || ih <= 0) { zoom = 1; panX = 0; panY = 0; return; }
  const scale = Math.min(cw / iw, ch / ih, 1);
  zoom = scale;
  panX = (cw - iw * zoom) / 2;
  panY = (ch - ih * zoom) / 2;
  applyTransform();
  syncCanvasSize();
}

function applyTransform() {
  VIEWPORT.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  ZOOM_PCT.textContent = Math.round(zoom * 100) + '%';
}

function syncCanvasSize() {
  CANVAS.width = IMG.naturalWidth;
  CANVAS.height = IMG.naturalHeight;
  CANVAS.style.width = IMG.naturalWidth + 'px';
  CANVAS.style.height = IMG.naturalHeight + 'px';
  CATCHER.style.width = IMG.naturalWidth + 'px';
  CATCHER.style.height = IMG.naturalHeight + 'px';
}

function screenToImg(sx, sy) {
  const rect = VIEWPORT.getBoundingClientRect();
  return { x: (sx - rect.left) / zoom, y: (sy - rect.top) / zoom };
}

function getNormFromScreen(sx, sy) {
  const p = screenToImg(sx, sy);
  return { x: Math.max(0, Math.min(1, p.x / IMG.naturalWidth)), y: Math.max(0, Math.min(1, p.y / IMG.naturalHeight)) };
}

function getImgPxFromScreen(sx, sy) {
  const p = screenToImg(sx, sy);
  return p;
}

// ── Zoom ──
function doZoom(delta, cx, cy) {
  const oldZ = zoom;
  zoom = Math.max(0.1, Math.min(20, zoom * delta));
  if (cx !== undefined && cy !== undefined) {
    const rect = WRAP.getBoundingClientRect();
    const mx = cx - rect.left, my = cy - rect.top;
    panX = mx - (mx - panX) * zoom / oldZ;
    panY = my - (my - panY) * zoom / oldZ;
  }
  applyTransform();
  drawAll();
}

ZOOM_IN.addEventListener('click', () => doZoom(1.3, WRAP.clientWidth/2, WRAP.clientHeight/2));
ZOOM_OUT.addEventListener('click', () => doZoom(1/1.3, WRAP.clientWidth/2, WRAP.clientHeight/2));
ZOOM_RESET.addEventListener('click', centerView);

WRAP.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    doZoom(e.deltaY > 0 ? 1/1.15 : 1.15, e.clientX, e.clientY);
  }
}, { passive: false });

// ── Pan ──
WRAP.addEventListener('mousedown', (e) => {
  if (e.target !== WRAP && e.target !== CATCHER && e.target !== CANVAS && e.target !== VIEWPORT) return;
  if (e.button === 1 || (e.shiftKey && e.button === 0)) {
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    WRAP.classList.add('dragging');
    e.preventDefault();
    return;
  }
});
document.addEventListener('mousemove', (e) => {
  if (isPanning) {
    panX = e.clientX - panStartX;
    panY = e.clientY - panStartY;
    applyTransform();
    drawAll();
  }
});
document.addEventListener('mouseup', () => { isPanning = false; WRAP.classList.remove('dragging'); });

// ── Mode toggle ──
MODE_BTNS.forEach(btn => {
  btn.addEventListener('click', () => {
    MODE_BTNS.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    if (mode === 'add') CATCHER.style.cursor = 'crosshair';
    else { CATCHER.style.cursor = 'default'; selectedRoadIdx = -1; updateUI(); }
  });
});

// ── Drawing ──
function startNewRoad() {
  if (currentRoad && currentRoad.points.length < 2) return;
  const t = getActiveType();
  if (currentRoad) roads.push(currentRoad);
  selectedRoadIdx = -1;
  currentRoad = { id:'R'+String(nextId++).padStart(2,'0'), name:'', type:t.type, width_px:t.width, color:t.color, points:[] };
  mode = 'add';
  MODE_BTNS.forEach(b => b.classList.remove('active'));
  MODE_BTNS[0].classList.add('active');
  CATCHER.style.cursor = 'crosshair';
  updateUI(); drawAll();
}
ADD_BTN.addEventListener('click', startNewRoad);

function finishRoad() {
  if (!currentRoad || currentRoad.points.length < 2) return;
  roads.push(currentRoad); currentRoad = null; updateUI(); drawAll();
}
FINISH_BTN.addEventListener('click', finishRoad);

UNDO_PT_BTN.addEventListener('click', () => {
  if (currentRoad && currentRoad.points.length > 0) { currentRoad.points.pop(); updateUI(); drawAll(); }
});
UNDO_ROAD_BTN.addEventListener('click', () => {
  if (roads.length > 0) { roads.pop(); if (selectedRoadIdx >= roads.length) selectedRoadIdx = -1; drawAll(); updateUI(); }
});
CLEAR_BTN.addEventListener('click', () => {
  if (roads.length === 0 && (!currentRoad || currentRoad.points.length === 0)) return;
  if (!confirm('¿Limpiar todas las calles?')) return;
  roads = []; currentRoad = null; selectedRoadIdx = -1; nextId = 1; updateUI(); drawAll();
});

// ── Node & road hit testing ──
function distPointSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax)*dx + (py - ay)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

function hitTest(ix, iy) {
  const threshold = 12 / zoom;
  let bestRoad = -1, bestDist = threshold + 1;
  for (let ri = 0; ri < roads.length; ri++) {
    const pts = roads[ri].points;
    for (let pi = 0; pi < pts.length; pi++) {
      const d = Math.hypot(pts[pi].x * IMG.naturalWidth - ix, pts[pi].y * IMG.naturalHeight - iy);
      if (d < bestDist) { bestDist = d; bestRoad = ri; }
    }
    for (let pi = 0; pi < pts.length - 1; pi++) {
      const ax = pts[pi].x * IMG.naturalWidth, ay = pts[pi].y * IMG.naturalHeight;
      const bx = pts[pi+1].x * IMG.naturalWidth, by = pts[pi+1].y * IMG.naturalHeight;
      const d = distPointSegment(ix, iy, ax, ay, bx, by);
      if (d < bestDist) { bestDist = d; bestRoad = ri; }
    }
  }
  return bestRoad >= 0 ? bestRoad : -1;
}

function findNearestNode(ix, iy, roadIdx) {
  const threshold = 15 / zoom;
  const pts = roads[roadIdx].points;
  let best = -1, bestD = threshold + 1;
  for (let pi = 0; pi < pts.length; pi++) {
    const d = Math.hypot(pts[pi].x * IMG.naturalWidth - ix, pts[pi].y * IMG.naturalHeight - iy);
    if (d < bestD) { bestD = d; best = pi; }
  }
  return best;
}

// ── Mouse ──
let clickTimer = null, clickCount = 0;

CATCHER.addEventListener('mousedown', (e) => {
  if (!imgLoaded || isPanning) return;
  const ip = getImgPxFromScreen(e.clientX, e.clientY);
  const ix = ip.x, iy = ip.y;

  if (mode === 'edit') {
    const hitRoad = hitTest(ix, iy);
    if (hitRoad < 0) { selectedRoadIdx = -1; updateUI(); drawAll(); return; }
    selectedRoadIdx = hitRoad;
    syncToolbarToRoad(roads[hitRoad]);
    updateUI(); drawAll();
    const ni = findNearestNode(ix, iy, hitRoad);
    if (ni >= 0) {
      drag = { kind:'node', roadIdx:hitRoad, ptIdx:ni, startIx:ix, startIy:iy, origPoints:null };
      return;
    }
    drag = { kind:'road', roadIdx:hitRoad, ptIdx:-1, startIx:ix, startIy:iy, origPoints:roads[hitRoad].points.map(p => ({...p})) };
    return;
  }

  if (mode === 'add') {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(() => {
        clickCount = 0;
        if (!currentRoad) {
          const t = getActiveType();
          currentRoad = { id:'R'+String(nextId++).padStart(2,'0'), name:'', type:t.type, width_px:t.width, color:t.color, points:[] };
        }
        currentRoad.points.push(getNormFromScreen(e.clientX, e.clientY));
        updateUI(); drawAll();
      }, 300);
    } else if (clickCount >= 2) {
      clearTimeout(clickTimer);
      clickCount = 0;
      if (currentRoad && currentRoad.points.length >= 2) finishRoad();
    }
  }
});

document.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const ip = getImgPxFromScreen(e.clientX, e.clientY);
  const dx = (ip.x - drag.startIx) / IMG.naturalWidth;
  const dy = (ip.y - drag.startIy) / IMG.naturalHeight;
  const r = roads[drag.roadIdx];
  if (drag.kind === 'node') {
    const p = getNormFromScreen(e.clientX, e.clientY);
    r.points[drag.ptIdx] = p;
  } else {
    for (let i = 0; i < r.points.length; i++) {
      r.points[i] = { x: Math.max(0, Math.min(1, drag.origPoints[i].x + dx)), y: Math.max(0, Math.min(1, drag.origPoints[i].y + dy)) };
    }
  }
  drawAll(); updateUI();
});

document.addEventListener('mouseup', () => { if (drag) { drag = null; } });

// ── Type buttons ──
TYPE_BTNS.forEach(btn => {
  btn.addEventListener('click', () => {
    TYPE_BTNS.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const t = getActiveType();
    if (currentRoad && currentRoad.points.length === 0) { currentRoad.type=t.type; currentRoad.width_px=t.width; currentRoad.color=t.color; }
    if (selectedRoadIdx >= 0 && selectedRoadIdx < roads.length) {
      roads[selectedRoadIdx].type=t.type; roads[selectedRoadIdx].width_px=t.width; roads[selectedRoadIdx].color=t.color;
      drawAll(); updateUI();
    }
  });
});

WIDTH_SLIDER.addEventListener('input', () => {
  const w = parseInt(WIDTH_SLIDER.value);
  WIDTH_DISPLAY.textContent = w;
  if (selectedRoadIdx >= 0 && selectedRoadIdx < roads.length) {
    roads[selectedRoadIdx].width_px = w; drawAll(); updateUI();
  }
  if (currentRoad) currentRoad.width_px = w;
});

// ── Export ──
EXPORT_BTN.addEventListener('click', () => {
  const allRoads = [...roads];
  if (currentRoad && currentRoad.points.length >= 2) {
    allRoads.push({ ...currentRoad, points:[...currentRoad.points], _pending:true });
  }
  const iw = IMG.naturalWidth, ih = IMG.naturalHeight;
  const output = {
    project: 'Zalei Agropecuaria',
    method: 'Road Labeler',
    base_image: 'ZALEI Google Earth best resulution.jpg',
    base_dimensions: { w: iw, h: ih },
    timestamp: new Date().toISOString(),
    roads: allRoads.map(r => ({
      id: r.id, name: r.name || '', type: r.type, width_px: r.width_px, color: r.color, description: '',
      points_normalized: r.points.map(p => ({ x: parseFloat(p.x.toFixed(4)), y: parseFloat(p.y.toFixed(4)) })),
      points_pixels: r.points.map(p => ({ x: Math.round(p.x*iw), y: Math.round(p.y*ih) }))
    }))
  };
  JSON_OUT.value = JSON.stringify(output, null, 2);
  EXPORT_AREA.classList.add('show');
});

document.querySelector('.close-area').addEventListener('click', () => EXPORT_AREA.classList.remove('show'));
document.querySelector('.copy-btn').addEventListener('click', () => { JSON_OUT.select(); document.execCommand('copy'); alert('Copiado'); });

// ── UI ──
function updateUI() {
  let totalPts = 0;
  roads.forEach(r => totalPts += r.points.length);
  if (currentRoad) totalPts += currentRoad.points.length;
  const rc = roads.length;
  let s = `${rc} calles, ${totalPts} puntos.`;
  if (currentRoad) s += ` Actual: ${currentRoad.id} (${currentRoad.type} ${currentRoad.width_px}px) — ${currentRoad.points.length} pts.`;
  else if (selectedRoadIdx >= 0) s += ` Seleccionada: ${roads[selectedRoadIdx].id} (${roads[selectedRoadIdx].type} ${roads[selectedRoadIdx].width_px}px) — ${roads[selectedRoadIdx].points.length} pts. Arrastrá nodos o toda la calle.`;
  else s += ` Modo: ${mode==='add'?'Dibujar (click para punto, doble click para terminar)':'Editar (click en calle para seleccionar, arrastrar nodo o calle)'}.`;
  STATUS.textContent = s;

  FINISH_BTN.disabled = !(currentRoad && currentRoad.points.length >= 2);
  UNDO_PT_BTN.disabled = !(currentRoad && currentRoad.points.length > 0);
  ADD_BTN.textContent = currentRoad ? '➕ Cerrar y nueva' : '+ Nueva calle';

  ROAD_LIST.innerHTML = '';
  roads.forEach((r, i) => {
    const chip = document.createElement('span');
    chip.className = 'road-chip' + (i === selectedRoadIdx ? ' selected' : '');
    chip.style.borderLeft = '4px solid ' + r.color;
    chip.innerHTML = `<span style="color:${r.color};font-weight:700">${r.id}</span> ${r.type} <span style="color:#888">${r.width_px}px</span> <span class="pts">${r.points.length}pts</span><span class="del" data-idx="${i}">✕</span>`;
    chip.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) return;
      if (currentRoad) return;
      if (selectedRoadIdx === i) { selectedRoadIdx = -1; updateUI(); drawAll(); return; }
      selectedRoadIdx = i; mode = 'edit';
      MODE_BTNS.forEach(b => b.classList.remove('active')); MODE_BTNS[1].classList.add('active');
      CATCHER.style.cursor = 'default';
      syncToolbarToRoad(roads[i]); updateUI(); drawAll();
    });
    ROAD_LIST.appendChild(chip);
  });
  if (currentRoad && currentRoad.points.length > 0) {
    const chip = document.createElement('span');
    chip.className = 'road-chip'; chip.style.borderLeft = '4px solid ' + currentRoad.color;
    chip.style.opacity = '0.7';
    chip.innerHTML = `<span style="color:${currentRoad.color};font-weight:700">${currentRoad.id}</span> ${currentRoad.type} <span class="pts">${currentRoad.points.length}pts</span> <em style="color:#888">activa</em>`;
    ROAD_LIST.appendChild(chip);
  }
  document.querySelectorAll('.road-chip .del').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation();
      const idx = parseInt(el.dataset.idx);
      roads.splice(idx, 1);
      if (selectedRoadIdx === idx) selectedRoadIdx = -1;
      else if (selectedRoadIdx > idx) selectedRoadIdx--;
      updateUI(); drawAll();
    });
  });
}

// ── Drawing ──
function drawAll() {
  if (!imgLoaded) return;
  CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
  roads.forEach((r, i) => drawRoad(r.points, r.color, r.width_px, i === selectedRoadIdx));
  if (currentRoad && currentRoad.points.length > 0) drawRoad(currentRoad.points, currentRoad.color, currentRoad.width_px, false, true);
}

function getRoadTypeByColor(color) {
  for (const [t, c] of Object.entries(ROAD_COLORS)) { if (c === color) return t; }
  return '';
}

function drawRoad(pts, color, widthPx, selected, isActive) {
  if (pts.length < 1) return;
  const w = IMG.naturalWidth, h = IMG.naturalHeight;
  const lineW = Math.max(1, widthPx);
  const dotR = Math.max(3, lineW * 0.7);
  const isFence = getRoadTypeByColor(color) === 'alambrado';

  CTX.beginPath();
  CTX.moveTo(pts[0].x * w, pts[0].y * h);
  for (let i = 1; i < pts.length; i++) CTX.lineTo(pts[i].x * w, pts[i].y * h);
  CTX.strokeStyle = color;
  CTX.lineWidth = lineW;
  CTX.lineCap = 'round';
  CTX.lineJoin = 'round';
  CTX.globalAlpha = isActive ? 0.9 : (selected ? 0.8 : 0.5);
  if (isFence) {
    CTX.setLineDash([6, 4]);
    CTX.stroke();
    CTX.setLineDash([]);
    // second dashed line offset for barbed wire look
    CTX.setLineDash([2, 8]);
    CTX.strokeStyle = '#555';
    CTX.lineWidth = 1;
    CTX.stroke();
    CTX.setLineDash([]);
  } else {
    CTX.stroke();
  }
  CTX.globalAlpha = 1;

  // selection highlight
  if (selected) {
    CTX.setLineDash([6, 4]);
    CTX.strokeStyle = '#fff';
    CTX.lineWidth = 1.5;
    CTX.stroke();
    CTX.setLineDash([]);
  }

  // nodes
  for (let i = 0; i < pts.length; i++) {
    const cx = pts[i].x * w, cy = pts[i].y * h;
    CTX.beginPath();
    CTX.arc(cx, cy, dotR, 0, Math.PI * 2);
    CTX.fillStyle = color;
    CTX.fill();
    CTX.strokeStyle = '#fff';
    CTX.lineWidth = 1;
    CTX.stroke();
    if (i === 0) {
      CTX.beginPath();
      CTX.arc(cx, cy, dotR + 3, 0, Math.PI * 2);
      CTX.strokeStyle = '#4f4';
      CTX.lineWidth = 1.5;
      CTX.stroke();
    }
    if (selected) {
      CTX.beginPath();
      CTX.arc(cx, cy, 8, 0, Math.PI * 2);
      CTX.strokeStyle = 'rgba(255,255,255,0.1)';
      CTX.lineWidth = 1;
      CTX.stroke();
    }
  }
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); UNDO_PT_BTN.click(); }
  if (e.key === 'Enter' && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); if (currentRoad && currentRoad.points.length >= 2) finishRoad(); }
  if (e.key === 'Escape') { e.preventDefault(); if (currentRoad && currentRoad.points.length > 0) { currentRoad = null; updateUI(); drawAll(); } }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); ADD_BTN.click(); }
  if (e.key === '1') { e.preventDefault(); TYPE_BTNS[0].click(); }
  if (e.key === '2') { e.preventDefault(); TYPE_BTNS[1].click(); }
  if (e.key === '3') { e.preventDefault(); TYPE_BTNS[2].click(); }
  if (e.key === '4') { e.preventDefault(); TYPE_BTNS[3].click(); }
  if (e.key === '5') { e.preventDefault(); TYPE_BTNS[4].click(); }
  if (e.key === '6') { e.preventDefault(); TYPE_BTNS[5].click(); }
  if ((e.key === 'e' || e.key === 'E') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); MODE_BTNS[1].click(); }
  if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); MODE_BTNS[0].click(); }
});
</script>
