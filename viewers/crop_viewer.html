<!DOCTYPE html>
<html lang="es">
<head>
<script src="../auth.js"></script>
<meta charset="UTF-8">
<title>Zalei Atlas — Crop Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0a0a; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
#app { display: flex; height: 100vh; }

/* === Sidebar === */
#sidebar { width: 260px; background: #141414; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; }
#sidebar-header { padding: 12px 14px; border-bottom: 1px solid #2a2a2a; }
#sidebar-header h1 { font-size: 14px; font-weight: 700; color: #fff; }
#sidebar-header .sub { font-size: 11px; color: #555; margin-top: 2px; }
#zone-list { flex: 1; overflow-y: auto; }
.zone-item { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px; font-size: 12px; border-bottom: 1px solid #1a1a1a; }
.zone-item:hover { background: #1c1c1c; }
.zone-item.active { background: #1a2a3a; border-left-color: #0066cc; }
.zone-color { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.zone-name { flex: 1; color: #bbb; line-height: 1.3; }
.zone-badge { font-size: 9px; color: #888; background: #222; padding: 1px 4px; border-radius: 6px; }
.zone-pending { font-size: 9px; color: #ffaa00; }

/* === Main === */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#toolbar { padding: 8px 14px; background: #141414; border-bottom: 1px solid #2a2a2a; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#toolbar h2 { font-size: 14px; color: #fff; flex: 1; }
.var-btn { background: #222; color: #aaa; border: 1px solid #333; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.var-btn:hover { background: #2a2a2a; color: #fff; }
.var-btn.active { background: #0066cc; color: #fff; border-color: #0066cc; }

#crop-display { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0a0a0a; }
#crop-wrap { position: relative; display: inline-block; max-width: 100%; max-height: 100%; }
#crop-img { display: block; max-width: 100%; max-height: 75vh; image-rendering: pixelated; border: 1px solid #2a2a2a; }
#crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#crop-overlay rect { pointer-events: all; cursor: pointer; }
#no-crop { color: #444; font-size: 14px; text-align: center; }

#info-bar { padding: 8px 14px; background: #141414; border-top: 1px solid #2a2a2a; display: flex; gap: 16px; font-size: 11px; color: #555; flex-wrap: wrap; }
#info-bar span b { color: #aaa; }

#mz-inspector { padding: 8px 14px; background: #141a22; border-top: 1px solid #1a2a3a; font-size: 11px; color: #88aacc; display: none; }
#mz-inspector.show { display: block; }
#mz-inspector b { color: #fff; }
#mz-inspector .field-line { margin: 2px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Crop Viewer</h1>
      <div class="sub">22 zonas | Atlas Method</div>
    </div>
    <div id="zone-list" id="zone-list"></div>
  </div>

  <div id="main">
    <div id="toolbar">
      <h2 id="crop-title">Seleccioná una zona</h2>
      <button class="var-btn active" data-variant="clean">Clean</button>
      <button class="var-btn" data-variant="border">Borde</button>
      <button class="var-btn" data-variant="coords">Coords</button>
      <button class="var-btn active-main" data-variant="label">Label</button>
      <button class="var-btn" id="btn-micro" title="Overlay microzonas">Microzonas</button>
    </div>

    <div id="crop-display">
      <div id="no-crop">
        <div style="font-size:32px;margin-bottom:12px">🗺️</div>
        <div>Seleccioná una zona en la lista</div>
        <div style="margin-top:6px;font-size:12px;color:#333">Los crops se generan desde zalei_satellite_5042x4474.png</div>
      </div>
      <div id="crop-wrap" style="display:none">
        <img id="crop-img" alt="Crop">
        <svg id="crop-overlay" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div id="info-bar">
      <span id="info-id"></span>
      <span id="info-bbox"></span>
      <span id="info-size"></span>
      <span id="info-status"></span>
      <span id="info-source"></span>
      <span id="info-micro"></span>
    </div>
    <div id="mz-inspector"></div>
  </div>
</div>

<script>
const ZONES = [
  { id:"Z01", name:"Recría Existente", color:"#FFD700", bbox:{x1:96,y1:133,x2:1316,y2:351,w:1219,h:218}, certainty:"high", count:null, pending:false, status:"validated", source:"Juan", folder:"z01_recría_existente" },
  { id:"Z02", name:"Guano", color:"#A0522D", bbox:{x1:2182,y1:544,x2:3484,y2:2641,w:1302,h:2097}, certainty:"medium", count:null, pending:true, status:"geometry_ok_subtype_pending", source:"Observación+Juan", folder:"z02_guano" },
  { id:"Z03", name:"Galpones De Ponedoras", color:"#00B4FF", bbox:{x1:234,y1:2032,x2:1815,y2:3800,w:1581,h:1768}, certainty:"high", count:10, pending:false, status:"count_validated", source:"Chadi", folder:"z03_galpones_de_ponedoras" },
  { id:"Z04", name:"Planta De Alimento", color:"#C800FF", bbox:{x1:2319,y1:3309,x2:2480,y2:3740,w:160,h:432}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z04_planta_de_alimento" },
  { id:"Z05", name:"Cintas Transportadoras", color:"#AAAAAA", bbox:{x1:779,y1:2214,x2:1027,y2:3286,w:248,h:1072}, certainty:"high", count:null, pending:false, status:"trajectory_validated", source:"Chadi", folder:"z05_cintas_transportadoras" },
  { id:"Z06", name:"Silos Secos", color:"#FF1493", bbox:{x1:2746,y1:3206,x2:3451,y2:3637,w:706,h:432}, certainty:"high", count:7, pending:false, status:"validated", source:"Juan", folder:"z06_silos_secos" },
  { id:"Z07", name:"Terreno Nuevo", color:"#00FF7F", bbox:{x1:3635,y1:0,x2:5042,y2:4124,w:1407,h:4124}, certainty:"high", count:null, pending:true, status:"perimeter_ok_content_pending", source:"Juan", folder:"z07_terreno_nuevo" },
  { id:"Z08", name:"Casa De Gerencia", color:"#0b206b", bbox:{x1:3401,y1:3820,x2:3635,y2:4098,w:234,h:278}, certainty:"high", count:null, pending:false, status:"validated", source:"Juan", folder:"z08_casa_de_gerencia" },
  { id:"Z09", name:"Departamentos De Empleados", color:"#6a5b19", bbox:{x1:399,y1:3852,x2:1027,y2:4057,w:628,h:205}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z09_departamentos_de_empleados" },
  { id:"Z10", name:"Clasificadora", color:"#b3abb0", bbox:{x1:889,y1:2560,x2:1623,y2:2833,w:733,h:274}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z10_clasificadora" },
  { id:"Z11", name:"Casa De Mantenimiento Sur", color:"#ff0f6d", bbox:{x1:1719,y1:3944,x2:1957,y2:4103,w:238,h:159}, certainty:"high", count:null, pending:true, status:"name_conflict_pending", source:"Juan", folder:"z11_casa_de_mantenimiento_sur" },
  { id:"Z12", name:"Taller", color:"#347c65", bbox:{x1:701,y1:3623,x2:958,y2:3860,w:257,h:237}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z12_taller" },
  { id:"Z13", name:"Casa De Mantenimiento Norte", color:"#284695", bbox:{x1:1554,y1:364,x2:1943,y2:569,w:390,h:205}, certainty:"high", count:null, pending:true, status:"name_conflict_pending", source:"Chadi", folder:"z13_casa_de_mantenimiento_norte" },
  { id:"Z14", name:"Aceitera", color:"#f23dd7", bbox:{x1:2466,y1:3431,x2:2599,y2:3718,w:133,h:287}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z14_aceitera" },
  { id:"Z15", name:"Silos Húmedos", color:"#cb8f8d", bbox:{x1:2663,y1:3096,x2:2755,y2:3301,w:92,h:205}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z15_silos_húmedos" },
  { id:"Z16", name:"Silos De Almacenamiento Consumo Y Expeller", color:"#6010d0", bbox:{x1:2448,y1:3201,x2:2654,y2:3470,w:206,h:269}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z16_silos_de_almacenamiento_consumo_y_expeller" },
  { id:"Z17", name:"Planta De Descarga De Granos", color:"#7a5b13", bbox:{x1:2361,y1:3036,x2:2420,y2:3246,w:60,h:209}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z17_planta_de_descarga_de_granos" },
  { id:"Z18", name:"Secado Y Limpieza De Granos", color:"#fe2948", bbox:{x1:2663,y1:3247,x2:2869,y2:3484,w:206,h:237}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi+Juan", folder:"z18_secado_y_limpieza_de_granos" },
  { id:"Z19", name:"Tanques De Aceite", color:"#e66981", bbox:{x1:2438,y1:3660,x2:2636,y2:3736,w:197,h:77}, certainty:"high", count:3, pending:false, status:"validated", source:"Chadi+Juan", folder:"z19_tanques_de_aceite" },
  { id:"Z20", name:"Descarga De Alimento", color:"#af1bdf", bbox:{x1:2251,y1:3188,x2:2434,y2:3447,w:183,h:260}, certainty:"high", count:null, pending:false, status:"validated", source:"Chadi", folder:"z20_descarga_de_alimento" },
  { id:"Z21", name:"Oficinas", color:"#b39bbd", bbox:{x1:2067,y1:3183,x2:2191,y2:3539,w:124,h:356}, certainty:"high", count:null, pending:false, status:"validated", source:"Juan", folder:"z21_oficinas" },
  { id:"Z22", name:"Balanza De Camiones", color:"#4c3fac", bbox:{x1:1998,y1:3188,x2:2072,y2:3544,w:73,h:356}, certainty:"high", count:null, pending:false, status:"validated", source:"Juan", folder:"z22_balanza_de_camiones" },
];

let currentZone = null;
let currentVariant = 'clean';
let showMicro = false;
let MICROZONES = [];           // loaded from atlas/microzones.json
let CROPS_MANIFEST = {};       // zone_id -> manifest entry (contains crop_actual_bbox)

fetch('../atlas/microzones.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => { MICROZONES = j.microzones || []; if (currentZone) showVariant(currentVariant); })
  .catch(err => console.warn('microzones.json fetch failed:', err));

fetch('../atlas/crops_manifest.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => {
    (j.crops || []).forEach(c => { CROPS_MANIFEST[c.zone_id] = c; });
    if (currentZone) showVariant(currentVariant);
  })
  .catch(err => console.warn('crops_manifest.json fetch failed:', err));

// Build sidebar
const list = document.getElementById('zone-list');
ZONES.forEach(z => {
  const div = document.createElement('div');
  div.className = 'zone-item';
  div.dataset.id = z.id;
  div.innerHTML = `
    <div class="zone-color" style="background:${z.color}"></div>
    <span class="zone-name">${z.id}: ${z.name}</span>
    ${z.count ? `<span class="zone-badge">×${z.count}</span>` : ''}
    ${z.pending ? `<span class="zone-pending">⚠</span>` : ''}
  `;
  div.addEventListener('click', () => loadZone(z));
  list.appendChild(div);
});

function loadZone(z) {
  currentZone = z;
  // Update sidebar
  document.querySelectorAll('.zone-item').forEach(el => el.classList.toggle('active', el.dataset.id === z.id));
  document.getElementById('crop-title').textContent = `${z.id}: ${z.name}`;
  showVariant(currentVariant);
  // Info bar
  document.getElementById('info-id').innerHTML = `<b>ID:</b> ${z.id}`;
  document.getElementById('info-bbox').innerHTML = `<b>BBox:</b> (${z.bbox.x1},${z.bbox.y1})→(${z.bbox.x2},${z.bbox.y2})`;
  document.getElementById('info-size').innerHTML = `<b>Tamaño:</b> ${z.bbox.w}×${z.bbox.h} px`;
  document.getElementById('info-status').innerHTML = `<b>Estado:</b> ${z.status}${z.pending ? ' ⚠️ CHADI' : ''}`;
  document.getElementById('info-source').innerHTML = `<b>Fuente:</b> ${z.source}`;
}

function showVariant(variant) {
  currentVariant = variant;
  if (!currentZone) return;
  const path = `../crops/${currentZone.folder}/${variant}.png`;
  const img = document.getElementById('crop-img');
  const wrap = document.getElementById('crop-wrap');
  const noCrop = document.getElementById('no-crop');
  wrap.style.display = 'inline-block';
  noCrop.style.display = 'none';
  img.src = path;
  img.onload = () => { drawMicroOverlay(); };
  img.onerror = () => {
    wrap.style.display = 'none';
    noCrop.style.display = 'block';
    noCrop.innerHTML = `<div style="font-size:24px;margin-bottom:8px">📂</div><div>Crop no encontrado:</div><div style="font-size:11px;color:#444;margin-top:4px">${path}</div><div style="margin-top:8px;font-size:12px;color:#333">Ejecutá: python scripts/generate_crops.py</div>`;
  };
  document.querySelectorAll('.var-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.variant === variant));
}

function drawMicroOverlay() {
  const overlay = document.getElementById('crop-overlay');
  const img = document.getElementById('crop-img');
  overlay.innerHTML = '';
  document.getElementById('mz-inspector').classList.remove('show');
  if (!currentZone || !showMicro) {
    document.getElementById('info-micro').innerHTML = '';
    return;
  }
  const manifest = CROPS_MANIFEST[currentZone.id];
  if (!manifest) {
    document.getElementById('info-micro').innerHTML = '<span style="color:#ff6666"><b>microzonas:</b> manifest no cargado</span>';
    return;
  }
  const cropBox = manifest.crop_actual_bbox;
  const cropW = manifest.crop_size.w;
  const cropH = manifest.crop_size.h;
  // SVG viewBox = crop pixel coords
  overlay.setAttribute('viewBox', `0 0 ${cropW} ${cropH}`);
  const childrenMicros = MICROZONES.filter(m => m.parent_zone === currentZone.id && m.bbox_pixels);
  document.getElementById('info-micro').innerHTML =
    `<b>Microzonas:</b> ${childrenMicros.length}/${MICROZONES.filter(m => m.parent_zone === currentZone.id).length}`;
  childrenMicros.forEach(m => {
    const bp = m.bbox_pixels;
    // parent coords -> crop coords
    const cx = bp.x1 - cropBox.x1, cy = bp.y1 - cropBox.y1;
    const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x', cx); r.setAttribute('y', cy);
    r.setAttribute('width', bp.w); r.setAttribute('height', bp.h);
    const color = m.color || '#fff';
    const styleByStatus = {
      validated: { alpha:'0.18', dash:null },
      probable:  { alpha:'0.12', dash:null },
      ambiguous: { alpha:'0.08', dash:'6,4' },
    };
    const s = styleByStatus[m.validation_status] || { alpha:'0', dash:'3,3' };
    r.setAttribute('fill', hexA(color, s.alpha));
    r.setAttribute('stroke', color);
    r.setAttribute('stroke-width', 2);
    if (s.dash) r.setAttribute('stroke-dasharray', s.dash);
    const title = document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent = `${m.id}: ${m.name} | ${m.validation_status} (${m.confidence})`;
    r.appendChild(title);
    r.addEventListener('click', () => showMicroInspector(m));
    overlay.appendChild(r);
    // ID label
    const short = m.id.includes('_') ? m.id.split('_').slice(1).join('_') : m.id;
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', cx + bp.w/2);
    t.setAttribute('y', cy + bp.h/2 + 6);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family','Arial,sans-serif');
    t.setAttribute('font-size', Math.max(14, Math.min(40, bp.w * 0.28)));
    t.setAttribute('font-weight','bold');
    t.setAttribute('fill','#fff');
    t.setAttribute('stroke','#000');
    t.setAttribute('stroke-width','0.8');
    t.setAttribute('paint-order','stroke');
    t.style.pointerEvents = 'none';
    t.textContent = short;
    overlay.appendChild(t);
  });
}

function hexA(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function showMicroInspector(m) {
  const valColorMap = {validated:'#4caf50',probable:'#ffd54f',ambiguous:'#ff9800'};
  const valColor = valColorMap[m.validation_status] || '#aaa';
  const insp = document.getElementById('mz-inspector');
  insp.classList.add('show');
  insp.innerHTML = `
    <div style="margin-bottom:4px;color:#88aacc;font-weight:bold">MICROZONA SELECCIONADA</div>
    <div class="field-line"><b>ID:</b> ${m.id}</div>
    <div class="field-line"><b>Name:</b> ${m.name}</div>
    <div class="field-line"><b>Parent:</b> ${m.parent_zone}</div>
    <div class="field-line"><b>Status:</b> <span style="color:${valColor}">${m.validation_status}</span> | <b>Confidence:</b> ${m.confidence}</div>
    <div class="field-line"><b>Source:</b> ${m.source || '-'}</div>
    <div class="field-line"><b>BBox px:</b> (${m.bbox_pixels.x1},${m.bbox_pixels.y1}) → (${m.bbox_pixels.x2},${m.bbox_pixels.y2}) — ${m.bbox_pixels.w}×${m.bbox_pixels.h}</div>
    ${m.requires_chadi_validation ? '<div class="field-line" style="color:#ffaa00"><b>⚠ Pendiente Chadi</b></div>' : ''}
    ${m.notes ? `<div class="field-line" style="color:#aaa;font-size:10px;margin-top:4px"><i>${m.notes}</i></div>` : ''}
  `;
}

// Variant buttons
document.querySelectorAll('.var-btn[data-variant]').forEach(btn => {
  btn.addEventListener('click', () => showVariant(btn.dataset.variant));
});

document.getElementById('btn-micro').addEventListener('click', function() {
  showMicro = !showMicro;
  this.classList.toggle('active', showMicro);
  drawMicroOverlay();
});

// Keyboard nav
window.addEventListener('keydown', e => {
  if (!currentZone) { if (e.key === 'Enter') loadZone(ZONES[0]); return; }
  const idx = ZONES.findIndex(z => z.id === currentZone.id);
  if (e.key === 'ArrowDown' || e.key === 'j') loadZone(ZONES[Math.min(idx+1, ZONES.length-1)]);
  if (e.key === 'ArrowUp' || e.key === 'k') loadZone(ZONES[Math.max(idx-1, 0)]);
  if (e.key === '1') showVariant('clean');
  if (e.key === '2') showVariant('border');
  if (e.key === '3') showVariant('coords');
  if (e.key === '4') showVariant('label');
});

// Start with Z06 (priority zone)
loadZone(ZONES.find(z => z.id === 'Z06'));
</script>
</body>
</html>
