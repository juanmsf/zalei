<!DOCTYPE html>
<html lang="es">
<head>
<script src="../auth.js"></script>
<meta charset="UTF-8">
<title>Z07 — Planificar Terreno Nuevo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0a0a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100vh}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#toolbar{padding:8px 14px;background:#141414;border-bottom:1px solid #333;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#toolbar h2{font-size:14px;color:#fff;margin:0;margin-right:12px}
#toolbar .hint{font-size:11px;color:#666;margin-left:auto}
#canvas-wrap{flex:1;overflow:auto;background:#000;display:flex;align-items:flex-start;justify-content:center;padding:10px;position:relative}
#canvas-wrap canvas{display:block;border:1px solid #222;cursor:crosshair;position:relative}
#panel{width:400px;background:#141414;border-left:1px solid #333;display:flex;flex-direction:column}
#panel-header{padding:12px;border-bottom:1px solid #333}
#panel-header h3{margin:0 0 2px;font-size:13px}
#panel-header .info{font-size:10px;color:#666}
#item-list{flex:1;overflow-y:auto;padding:8px}
.item{background:#1e1e1e;border-radius:4px;padding:8px 10px;margin-bottom:6px;border-left:4px solid #00FF7F;cursor:pointer;transition:all .15s}
.item.active{background:#1a2e24;outline:2px solid #00FF7F}
.item .row{display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:3px}
.item label{color:#888;min-width:30px;font-size:10px}
.item input[type=text],.item input[type=number]{background:#111;color:#eee;border:1px solid #333;padding:2px 5px;border-radius:2px;font-size:11px;width:55px;font-family:monospace}
.item .id-label{font-weight:700;color:#00FF7F;font-size:13px;min-width:70px}
.item .coords{font-family:monospace;font-size:10px;color:#aaa}
.item .actions{display:flex;gap:4px;margin-top:4px}
.item .actions button{flex:1;font-size:10px;padding:3px 6px;background:#2a2a2a;border:1px solid #444;color:#ccc;border-radius:2px;cursor:pointer}
.item .actions button:hover{background:#3a3a3a}
.item .actions button.danger{background:#822;border-color:#a44}
.item .actions button.danger:hover{background:#a33}
.item .status-done{color:#4caf50;font-size:10px}
.item .status-pending{color:#ffaa00;font-size:10px}
#export-section{border-top:1px solid #333;padding:8px}
#export-area{width:100%;min-height:60px;background:#000;color:#6f6;font-family:Consolas,monospace;font-size:10px;border:1px solid #333;padding:4px;resize:vertical}
#footer{display:flex;gap:4px;padding:6px 0 0;align-items:center}
#footer button{font-size:10px;padding:4px 8px;background:#222;border:1px solid #444;color:#ccc;border-radius:2px;cursor:pointer}
#footer button.primary{background:#06c;border-color:#08e;color:#fff}
#footer button.danger{background:#a22;border-color:#c44}
#footer .cnt{font-size:10px;color:#666;margin-left:auto}
.rot-badge{background:#ffcc00;color:#000;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;margin-left:6px}
.ref-info{font-size:10px;color:#888;background:#1a1a1a;padding:6px 10px;border-radius:4px;margin-bottom:8px;border-left:3px solid #FFD700}
.ref-info b{color:#FFD700}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="toolbar">
      <h2>Z07 — Planificar Terreno Nuevo</h2>
      <button id="btn-add-z01">+ Galpón Recría (Z01)</button>
      <button id="btn-add">+ Custom</button>
      <button id="btn-snap">📐 Snap Z01</button>
      <button id="btn-export-json">📋 Exportar JSON</button>
      <button id="btn-reset" style="background:#822;border-color:#a44">↺ Reset</button>
      <span class="hint">R rotar · Esc deseleccionar</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
    </div>
  </div>
  <div id="panel">
    <div id="panel-header">
      <h3>Elementos</h3>
      <div class="info">coords en crop-space (1487×4204)</div>
    </div>
    <div id="item-list">
      <div class="ref-info">Referencia <b>Z01</b> (Recría Existente): 1219×218 px · gable_box · 5 m</div>
    </div>
    <div id="export-section">
      <textarea id="export-area" readonly placeholder="JSON..."></textarea>
      <div id="footer">
        <button id="btn-copy-json" class="primary">📋 Copiar</button>
        <span class="cnt" id="status-cnt"></span>
      </div>
    </div>
  </div>
</div>

<script>
const CROP_W = 1487, CROP_H = 4204;
const OFF_X = 3555, OFF_Y = 0;
const SAT_W = 5042, SAT_H = 4474;
const STORAGE_KEY = 'atlas_zalei_z07_measurements_v1';
// Z01 reference dimensions in sat pixels
const Z01_SAT_W = 1219, Z01_SAT_H = 218;

const DEFAULT_RECTS = [{"id": "Z07_G_NEW_01", "cx": 394, "cy": 836, "w": 1219, "h": 218, "rot": 90}, {"id": "Z07_G_NEW_02", "cx": 695, "cy": 831, "w": 1219, "h": 218, "rot": 90}];
let rects = JSON.parse(JSON.stringify(DEFAULT_RECTS));
let selectedIdx = -1;
let drawing = null;
let dragHandle = null;
let dragStart = null;
let imgScale = 1;
let _img = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function loadImage() {
  const img = new Image();
  img.onload = () => {
    _img = img;
    const maxW = window.innerWidth - 460;
    const maxH = window.innerHeight - 80;
    const s = Math.min(maxW / CROP_W, maxH / CROP_H, 1.8);
    imgScale = s;
    canvas.width = CROP_W * s;
    canvas.height = CROP_H * s;
    draw();
  };
  img.src = '../crops/z07_terreno_nuevo/clean.png';
}

// ===== GEOMETRY HELPERS =====
function rectCorners(r) {
  const hw = r.w / 2, hh = r.h / 2;
  const rad = r.rot * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([lx, ly]) => ({
    x: r.cx + lx * cos - ly * sin,
    y: r.cy + lx * sin + ly * cos
  }));
}

function pointInRotatedRect(px, py, r) {
  const dx = px - r.cx, dy = py - r.cy;
  const rad = -r.rot * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;
  return Math.abs(lx) <= r.w / 2 && Math.abs(ly) <= r.h / 2;
}

function getHandlePositions(r) {
  const corners = rectCorners(r);
  const hs = 7 / imgScale;
  return corners.map((p, i) => ({
    x: p.x, y: p.y,
    name: ['nw','ne','se','sw'][i],
    hit: (mx, my) => Math.abs(mx - p.x) < hs && Math.abs(my - p.y) < hs
  }));
}

// ===== DRAW =====
function draw() {
  const s = imgScale;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (_img) ctx.drawImage(_img, 0, 0, canvas.width, canvas.height);

  rects.forEach((r, i) => {
    const isSel = i === selectedIdx;
    const corners = rectCorners(r);
    const cvsPts = corners.map(p => [p.x * s, p.y * s]);

    ctx.beginPath();
    ctx.moveTo(cvsPts[0][0], cvsPts[0][1]);
    for (let j = 1; j < 4; j++) ctx.lineTo(cvsPts[j][0], cvsPts[j][1]);
    ctx.closePath();

    ctx.fillStyle = `rgba(0,255,127,${isSel ? 0.25 : 0.12})`;
    ctx.fill();
    ctx.strokeStyle = isSel ? '#fff' : '#00FF7F';
    ctx.lineWidth = isSel ? 3 : 2;
    ctx.stroke();

    const label = r.id || '';
    ctx.fillStyle = '#00FF7F';
    ctx.font = 'bold 13px sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(label, cvsPts[0][0] + 4, cvsPts[0][1] - 6);

    const pw = Math.round(r.w);
    const ph = Math.round(r.h);
    ctx.fillStyle = '#aaa';
    ctx.font = '10px monospace';
    ctx.textBaseline = 'top';
    ctx.fillText(pw + 'x' + ph + 'px', cvsPts[0][0] + 4, cvsPts[0][1] + 4);

    if (r.rot) {
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(r.rot + '°', cvsPts[0][0] + 4, cvsPts[0][1] + 18);
    }

    if (isSel) {
      const hs = 5;
      cvsPts.forEach(([hx, hy]) => {
        ctx.fillStyle = '#fff';
        ctx.fillRect(hx - hs, hy - hs, hs*2, hs*2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(hx - hs, hy - hs, hs*2, hs*2);
      });

      const cxc = r.cx * s, cyc = r.cy * s;
      const rotOff = Math.max(r.w, r.h) / 2 * s + 22;
      const rad = r.rot * Math.PI / 180;
      const rhx = cxc + rotOff * Math.sin(rad);
      const rhy = cyc - rotOff * Math.cos(rad);
      ctx.beginPath();
      ctx.arc(rhx, rhy, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc00';
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cxc, cyc, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,255,127,0.5)';
      ctx.fill();
    }
  });

  if (drawing) {
    const [dx1, dy1] = [drawing.x1 * s, drawing.y1 * s];
    const [dx2, dy2] = [drawing.x2 * s, drawing.y2 * s];
    ctx.strokeStyle = 'rgba(255,255,0,0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    ctx.strokeRect(dx1, dy1, dx2 - dx1, dy2 - dy1);
    ctx.setLineDash([]);
  }
}

// ===== CANVAS INTERACTION =====
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / imgScale;
  const my = (e.clientY - rect.top) / imgScale;

  if (selectedIdx >= 0 && selectedIdx < rects.length) {
    const r = rects[selectedIdx];
    const rotOff = Math.max(r.w, r.h) / 2 + 22 / imgScale;
    const rad = r.rot * Math.PI / 180;
    const rhx = r.cx + rotOff * Math.sin(rad);
    const rhy = r.cy - rotOff * Math.cos(rad);
    if (Math.abs(mx - rhx) < 10 / imgScale && Math.abs(my - rhy) < 10 / imgScale) {
      dragHandle = 'rotate';
      dragStart = { mx, my, rect: JSON.parse(JSON.stringify(r)), idx: selectedIdx };
      return;
    }
  }

  if (selectedIdx >= 0 && selectedIdx < rects.length) {
    const r = rects[selectedIdx];
    const handles = getHandlePositions(r);
    for (const h of handles) {
      if (h.hit(mx, my)) {
        dragHandle = h.name;
        dragStart = { mx, my, rect: JSON.parse(JSON.stringify(r)), idx: selectedIdx };
        return;
      }
    }
  }

  for (let i = rects.length - 1; i >= 0; i--) {
    if (pointInRotatedRect(mx, my, rects[i])) {
      selectedIdx = i;
      dragHandle = 'move';
      dragStart = { mx, my, rect: JSON.parse(JSON.stringify(rects[i])), idx: i };
      renderPanel();
      draw();
      return;
    }
  }

  selectedIdx = -1;
  drawing = { x1: mx, y1: my, x2: mx, y2: my };
  renderPanel();
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / imgScale;
  const my = (e.clientY - rect.top) / imgScale;

  if (drawing) {
    drawing.x2 = mx; drawing.y2 = my;
    draw();
    return;
  }

  if (!dragStart) return;

  const r0 = dragStart.rect;
  const dx = mx - dragStart.mx;
  const dy = my - dragStart.my;
  const target = rects[dragStart.idx];
  if (!target) return;

  if (dragHandle === 'move') {
    target.cx = r0.cx + dx;
    target.cy = r0.cy + dy;
  } else if (dragHandle === 'rotate') {
    const angle0 = Math.atan2(dragStart.mx - r0.cx, -(dragStart.my - r0.cy)) * 180 / Math.PI;
    const angle1 = Math.atan2(mx - r0.cx, -(my - r0.cy)) * 180 / Math.PI;
    target.rot = (r0.rot + (angle1 - angle0) + 360) % 360;
    target.rot = Math.round(target.rot);
  } else {
    const r = r0;
    const rad = r.rot * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const ldx = dx * cos + dy * sin;
    const ldy = -dx * sin + dy * cos;
    let lx1 = -r.w / 2, ly1 = -r.h / 2, lx2 = r.w / 2, ly2 = r.h / 2;
    if (dragHandle.includes('w')) lx1 += ldx;
    if (dragHandle.includes('e')) lx2 += ldx;
    if (dragHandle.includes('n')) ly1 += ldy;
    if (dragHandle.includes('s')) ly2 += ldy;
    if (lx2 - lx1 < 4) return;
    if (ly2 - ly1 < 4) return;
    const lcx = (lx1 + lx2) / 2;
    const lcy = (ly1 + ly2) / 2;
    target.cx = r.cx + lcx * cos - lcy * sin;
    target.cy = r.cy + lcx * sin + lcy * cos;
    target.w = lx2 - lx1;
    target.h = ly2 - ly1;
  }

  draw();
  renderPanel();
  updateExport();
});

canvas.addEventListener('mouseup', () => {
  if (drawing) {
    const d = drawing;
    const x1 = Math.min(d.x1, d.x2), y1 = Math.min(d.y1, d.y2);
    const x2 = Math.max(d.x1, d.x2), y2 = Math.max(d.y1, d.y2);
    if (x2 - x1 > 5 && y2 - y1 > 5) {
      rects.push({
        id: '',
        cx: (x1 + x2) / 2,
        cy: (y1 + y2) / 2,
        w: x2 - x1,
        h: y2 - y1,
        rot: 0
      });
      selectedIdx = rects.length - 1;
      saveStorage();
    }
    drawing = null;
    renderPanel();
    draw();
    updateExport();
  }
  dragStart = null;
  dragHandle = null;
});

canvas.addEventListener('mouseleave', () => {
  if (drawing) { drawing = null; draw(); }
});

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIdx >= 0) {
    rects.splice(selectedIdx, 1);
    selectedIdx = Math.min(selectedIdx, rects.length - 1);
    saveStorage(); renderPanel(); draw(); updateExport();
  }
  if (e.key === 'Escape') {
    selectedIdx = -1; drawing = null;
    renderPanel(); draw();
  }
  if ((e.key === 'r' || e.key === 'R') && selectedIdx >= 0) {
    const r = rects[selectedIdx];
    const step = e.shiftKey ? -15 : 15;
    r.rot = ((r.rot || 0) + step + 360) % 360;
    saveStorage(); renderPanel(); draw(); updateExport();
  }
});

// ===== PANEL =====
function renderPanel() {
  const list = document.getElementById('item-list');
  // Keep ref-info at top
  list.innerHTML = '<div class="ref-info">Referencia <b>Z01</b> (Recría Existente): 1219×218 px · gable_box · 5 m</div>';
  if (rects.length === 0) {
    list.innerHTML += '<div style="padding:20px;text-align:center;color:#555;font-size:12px">Dibujá rectángulos sobre el terreno nuevo.<br>Usá <b>+ Galpón Recría (Z01)</b> o arrastrá en el canvas.<br><br><b>R</b> rotar · <b>Delete</b> eliminar</div>';
    return;
  }
  rects.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'item' + (i === selectedIdx ? ' active' : '');
    const id = r.id || ('Z07_EL' + (i+1));
    const corners = rectCorners(r);
    const minX = Math.min(...corners.map(c => c.x));
    const minY = Math.min(...corners.map(c => c.y));
    const maxX = Math.max(...corners.map(c => c.x));
    const maxY = Math.max(...corners.map(c => c.y));
    const sx1 = Math.round(OFF_X + minX), sy1 = Math.round(OFF_Y + minY);
    const sx2 = Math.round(OFF_X + maxX), sy2 = Math.round(OFF_Y + maxY);

    div.innerHTML =
      '<div class="row">' +
        '<span class="id-label">' + id + '</span>' +
        '<input type="text" value="' + Math.round(r.w) + '" readonly style="width:55px">' +
        '<span style="color:#666">×</span>' +
        '<input type="text" value="' + Math.round(r.h) + '" readonly style="width:55px">' +
        (r.rot ? '<span class="rot-badge">' + r.rot + '°</span>' : '') +
        '<span style="margin-left:auto">' +
          (Math.round(r.w) >= 50 && Math.round(r.h) >= 20 ? '<span class="status-done">✓</span>' : '<span class="status-pending">⚠</span>') +
        '</span>' +
      '</div>' +
      '<div class="coords">crop: (' + Math.round(minX) + ',' + Math.round(minY) + ') → (' + Math.round(maxX) + ',' + Math.round(maxY) + ')</div>' +
      '<div class="coords">sat:  (' + sx1 + ',' + sy1 + ') → (' + sx2 + ',' + sy2 + ') · rot:' + r.rot + '°</div>' +
      '<div class="actions">' +
        '<button onclick="selRect(' + i + ')">Seleccionar</button>' +
        '<button onclick="editId(' + i + ')">ID</button>' +
        '<button onclick="rot15(' + i + ')">R +15°</button>' +
        '<button class="danger" onclick="delRect(' + i + ')">Eliminar</button>' +
      '</div>';
    list.appendChild(div);
  });
}

function selRect(i) { selectedIdx = i; renderPanel(); draw(); }
function editId(i) {
  const r = rects[i];
  if (!r) return;
  const n = prompt('ID:', r.id || '');
  if (n) { r.id = n; saveStorage(); renderPanel(); updateExport(); }
}
function rot15(i) {
  const r = rects[i];
  if (!r) return;
  r.rot = ((r.rot || 0) + 15) % 360;
  saveStorage(); renderPanel(); draw(); updateExport();
}
function delRect(i) {
  rects.splice(i, 1);
  if (selectedIdx >= rects.length) selectedIdx = rects.length - 1;
  saveStorage(); renderPanel(); draw(); updateExport();
}

// ===== EXPORT =====
function computeAxisAlignedBBox(r) {
  const corners = rectCorners(r);
  const xs = corners.map(c => c.x), ys = corners.map(c => c.y);
  return { x1: Math.round(Math.min(...xs)), y1: Math.round(Math.min(...ys)), x2: Math.round(Math.max(...xs)), y2: Math.round(Math.max(...ys)) };
}

function buildExport() {
  return rects.map((r, i) => {
    const id = r.id || ('Z07_EL' + (i+1));
    const bb = computeAxisAlignedBBox(r);
    const cw = bb.x2 - bb.x1, ch = bb.y2 - bb.y1;
    const sx1 = OFF_X + bb.x1, sy1 = OFF_Y + bb.y1;
    const sx2 = OFF_X + bb.x2, sy2 = OFF_Y + bb.y2;
    return {
      id, parent_zone: 'Z07',
      rotation_deg: r.rot || 0,
      crop_bbox: { x1: bb.x1, y1: bb.y1, x2: bb.x2, y2: bb.y2, w: cw, h: ch },
      center_crop: { cx: Math.round(r.cx), cy: Math.round(r.cy) },
      satellite_bbox_px: { x1: sx1, y1: sy1, x2: sx2, y2: sy2, w: Math.round(sx2-sx1), h: Math.round(sy2-sy1) },
      normalized: {
        x: +(sx1 / SAT_W).toFixed(4),
        y: +(sy1 / SAT_H).toFixed(4),
        w: +((sx2 - sx1) / SAT_W).toFixed(4),
        h: +((sy2 - sy1) / SAT_H).toFixed(4)
      },
      subtype: 'galpon_recria_futuro',
      shape: 'gable_box',
      height_m_estimated: 5,
      height_confidence: 'medium',
      is_heuristic_height: false,
      validation_status: 'planned_in_crop_editor',
      requires_chadi_validation: true
    };
  });
}

function buildBlockoutEntries() {
  return rects.map((r, i) => {
    const id = r.id || ('Z07_EL' + (i+1));
    const bb = computeAxisAlignedBBox(r);
    const nw = {
      x: (OFF_X + bb.x1) / SAT_W,
      y: (OFF_Y + bb.y1) / SAT_H,
      w: (bb.x2 - bb.x1) / SAT_W,
      h: (bb.y2 - bb.y1) / SAT_H
    };
    return {
      id, source: 'microzone', parent_zone: 'Z07',
      render_mode: 'building', skip_reason: null,
      shape: 'gable_box', subtype: 'galpon_recria_futuro',
      label: id,
      color: '#00FF7F',
      rotation_deg: r.rot || 0,
      footprint: {
        cx: +((nw.x + nw.w/2) * 50.42).toFixed(4),
        cz: +((nw.y + nw.h/2) * 44.74).toFixed(4),
        w: +(nw.w * 50.42).toFixed(3),
        d: +(nw.h * 44.74).toFixed(3)
      },
      height_m_estimated: 5.0, height_3d_units: 0.3333,
      height_confidence: 'medium', is_heuristic_height: false,
      validation_status: 'planned_in_crop_editor', confidence: 'medium',
      requires_chadi_validation: true, is_questioned: false
    };
  });
}

function updateExport() {
  document.getElementById('export-area').value = JSON.stringify(buildExport(), null, 2);
  document.getElementById('status-cnt').textContent = rects.length + ' elementos';
}

// ===== STORAGE =====
function saveStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(rects)); }
function loadStorage() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const d = JSON.parse(s);
      rects = d.map(x => ({ ...x, rot: x.rot || 0 }));
      return true;
    }
  } catch(e) {}
  rects = JSON.parse(JSON.stringify(DEFAULT_RECTS));
  return true;
}

// ===== BUTTONS =====
document.getElementById('btn-add-z01').addEventListener('click', () => {
  const count = rects.length;
  const x = 100 + (count % 2) * 700, y = 100 + Math.floor(count / 2) * 400;
  rects.push({ id: '', cx: x + Z01_SAT_W/2, cy: y + Z01_SAT_H/2, w: Z01_SAT_W, h: Z01_SAT_H, rot: 0 });
  selectedIdx = rects.length - 1;
  saveStorage(); renderPanel(); draw(); updateExport();
});

document.getElementById('btn-add').addEventListener('click', () => {
  const i = rects.length;
  const x = 120 + (i % 3) * 200, y = 120 + Math.floor(i / 3) * 300;
  rects.push({ id: '', cx: x + 80, cy: y + 100, w: 160, h: 200, rot: 0 });
  selectedIdx = rects.length - 1;
  saveStorage(); renderPanel(); draw(); updateExport();
});

document.getElementById('btn-snap').addEventListener('click', () => {
  if (selectedIdx < 0 || selectedIdx >= rects.length) return;
  const r = rects[selectedIdx];
  // Snap w to Z01 size
  const ok = confirm('¿Ajustar este rect a ' + Z01_SAT_W + '×' + Z01_SAT_H + ' px (tamaño Z01)?');
  if (!ok) return;
  r.w = Z01_SAT_W;
  r.h = Z01_SAT_H;
  r.rot = 0;
  saveStorage(); renderPanel(); draw(); updateExport();
});

document.getElementById('btn-export-json').addEventListener('click', () => {
  const b = new Blob([JSON.stringify(buildExport(), null, 2)], { type: 'application/json' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = 'z07_terreno_nuevo_planned.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(u);
});

document.getElementById('btn-copy-json').addEventListener('click', () => {
  const ta = document.getElementById('export-area');
  ta.select();
  navigator.clipboard.writeText(ta.value).catch(() => document.execCommand('copy'));
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('¿Resetear todos los rectángulos?')) return;
  rects = []; selectedIdx = -1;
  saveStorage(); renderPanel(); draw(); updateExport();
});

loadStorage();
loadImage();
renderPanel();
updateExport();
</script>
</body>
</html>
